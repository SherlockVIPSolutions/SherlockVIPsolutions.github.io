e:[`Visible blood in the urine in an adult, especially when painless and without infection, should be treated as a sign of urinary tract cancer until proven otherwise. The most common cause in older adults is urothelial carcinoma of the bladder. Major risk factors include smoking (the strongest), work exposure to aromatic amines (dye, rubber, leather, and textile industries), cyclophosphamide, pelvic radiation, and chronic bladder irritation (eg, schistosomiasis). Uniformly shaped red cells without protein or casts point to a source in the urinary tract rather than the kidney's filtering units.`,
`Evaluation of visible hematuria requires imaging of the upper tract and direct inspection of the bladder. Cystoscopy is the gold standard for detecting bladder cancer, and multiphase CT urography examines the kidneys, renal pelvis, and ureters for kidney cancer, upper tract urothelial cancer, and stones. Urine cytology may be added but often misses low-grade tumors.`],
w:{A:`Antibiotics are appropriate only when there is evidence of infection. This patient has no urinary symptoms, no pyuria, no nitrites, and a negative culture, and empiric treatment would delay a cancer diagnosis.`,
B:`Kidney biopsy is used for blood in the urine from the kidney's filtering units, suggested by misshapen red cells, red cell casts, protein in the urine, or rising creatinine. This patient has none of these.`,
C:`Visible hematuria in a high-risk patient should never be simply watched. Even a single episode warrants a full urologic evaluation.`,
E:`An enlarged prostate can bleed, but it is a diagnosis of exclusion. With a normal PSA and no nodules, prostate biopsy is not indicated, and the bladder and upper tract must be evaluated first.`},
k:`Painless visible hematuria in an older adult, especially a smoker or someone exposed to aromatic amines, requires cystoscopy and CT urography to evaluate for urothelial carcinoma.`}
);

 const inv=[];idx.forEach((o,n)=>inv[o]=n);

/* ---------- ECG strips (drawn, not photographed) ---------- */
const ECG=(()=>{let uid=0;
const g=(t,c,w,a)=>a*Math.exp(-((t-c)**2)/(2*w*w));
const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function beat(t,L){const q=L.qw||1,c=190,j=c+24*q;let v=0;
 if(L.p!==0)v+=g(t,70,16,L.p??.12);
 v+=g(t,c-12*q,4*q,L.Q??-.06)+g(t,c,6*q,L.R??1)+g(t,c+13*q,5*q,L.S??-.25);
 if(L.st)v+=L.st*sm((t-j)/12)*(1-sm((t-(j+230))/60));
 v+=g(t,j+(L.tc||150),L.tw||38,L.T??.3);return v}
function lead(L,beats,x0,y0,w,h,dur){const pts=[],base=y0+h*.62;
 for(let t=0;t<=dur;t+=4){let v=0;for(const b of beats){const d=t-b;if(d>-60&&d<760)v+=beat(d,L)}
  if(L.fib)v+=.045*Math.sin(t/21)+.03*Math.sin(t/33+1.3)+.025*Math.sin(t/13+2.1);
  pts.push((x0+t*w/dur).toFixed(1)+','+(base-v*40).toFixed(1))}
 return`<polyline points="${pts.join(' ')}" fill="none" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/><text x="${x0+6}" y="${y0+16}" font-size="13" font-family="Arial,sans-serif" font-weight="700" fill="#111">${L.n}</text>`}
function strip(rows,cols,dur,beats,leads){const W=900,cw=W/cols,ch=130,H=rows*ch,id='g'+(++uid);
 let s=`<svg class="ecg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Electrocardiogram tracing"><defs><pattern id="${id}s" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 0H0V4" fill="none" stroke="#f6cccc" stroke-width=".5"/></pattern><pattern id="${id}" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="url(#${id}s)"/><path d="M20 0H0V20" fill="none" stroke="#e8a3a3" stroke-width="1"/></pattern></defs><rect width="${W}" height="${H}" fill="#fff"/><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
 leads.forEach((L,i)=>{const r=Math.floor(i/cols),c=i%cols;s+=lead(L,beats,c*cw,r*ch,cw,ch,dur);if(c)s+=`<line x1="${c*cw}" y1="${r*ch+40}" x2="${c*cw}" y2="${r*ch+90}" stroke="#111" stroke-width="1.3"/>`});
 return s+'</svg>'}
return{
inferior:()=>strip(2,3,2250,[150,1350],[
 {n:'I',R:.55,S:-.1,st:-.12,T:-.08},{n:'II',R:1,S:-.2,st:.22,T:.34},{n:'III',R:.75,S:-.12,st:.32,T:.42},
 {n:'aVR',R:.12,Q:0,S:-.7,st:-.06,T:-.24},{n:'aVL',R:.3,S:-.32,st:-.22,T:-.2},{n:'aVF',R:.88,S:-.15,st:.27,T:.38}]),
afib:()=>{const r=rng(42),b=[];for(let x=80;x<9000;x+=380+r()*360)b.push(x);return strip(1,1,9000,b,[{n:'II',p:0,fib:1,R:1.05,S:-.2,T:.22}])},

services(){return`<h1 style="font-size:32px">${t('svc_h')}</h1><div class="grid">
<a class="card svc" href="#/report"><h3>${t('svc_rep')} →</h3><p class="muted" style="margin:0">${t('svc_rep_p')}</p></a>
<a class="card svc" href="#/tutoring"><h3>${t('svc_tut')} →</h3><p class="muted" style="margin:0">${t('svc_tut_p')}</p></a></div>`},

report(){const T=getTests(),agg={};let C=0,N=0;
 T.forEach(x=>x.items.forEach(it=>{const a=agg[it.subj]||(agg[it.subj]=[0,0]);a[1]++;N++;if(it.pick===it.ans){a[0]++;C++}}));
 if(!N)return`${notice()}<h1 style="font-size:32px">${t('rep_h')}</h1><div class="card"><p class="muted">${t('rep_none')}</p><a class="btn" href="#/create">${t('nav_create')}</a></div>`;
 const row=(name,c,n,b)=>{const p=Math.round(100*c/n);return`<tr${b?' style="font-weight:800"':''}><td>${name}</td><td>${c}/${n}</td><td><div style="display:flex;align-items:center;gap:10px"><div class="pbar" style="flex:1"><div style="width:${p}%"></div></div><b style="min-width:42px;text-align:right">${p}%</b></div></td></tr>`};
 const subs=[...SUBJECTS.filter(s=>agg[s]),...Object.keys(agg).filter(s=>!SUBJECTS.includes(s))];
 return`${notice()}<h1 style="font-size:32px">${t('rep_h')}</h1><p class="muted">${T.length===1?t('rep_sub1'):t('rep_sub',{n:T.length})}</p>
<div class="card tbl"><table><thead><tr><th>${t('th_topic')}</th><th>${t('th_correct')}</th><th style="width:50%">${t('th_pct')}</th></tr></thead><tbody>
${subs.map(s=>row(esc(sub(s)),agg[s][0],agg[s][1])).join('')}${row(t('rep_overall'),C,N,1)}</tbody></table></div>`},

tutoring(){return`<h1 style="font-size:32px">${t('tut_h')}</h1><div class="card form"><p class="muted">${t('tut_p')}</p>
<form id="tutf" novalidate><label for="tt">${t('f_title')}</label><input id="tt" type="text" maxlength="150" placeholder="${t('f_title_ph')}">
<label for="te">${t('f_email')}</label><input id="te" type="email" autocomplete="email" maxlength="150">
<label for="ts">${t('f_subject')}</label><textarea id="ts" maxlength="3000" placeholder="${t('f_subject_ph')}"></textarea>
<input class="hp" id="thp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="err" id="terr"></div><button class="btn" type="submit">${t('send_req')}</button><div class="okmsg" id="tok" role="status"></div></form></div>`},

donate(){return`<h1 style="font-size:32px">${t('donate_h')}</h1><div class="card form"><p>${t('donate_p')}</p>
<div class="row"><a class="btn" href="${DONATE_URL}" target="_blank" rel="noopener">☕ ${t('donate_btn')}</a></div>
<p class="muted" style="font-size:13px;margin:14px 0 0">${t('donate_note')}</p></div>`},

help(){return`<h1 style="font-size:32px">${t('help_h')}</h1><div class="card">${t('faq').map(x=>`<details><summary>${x[0]}</summary><p class="muted" style="margin:8px 0 0">${x[1]}</p></details>`).join('')}</div>
<div class="card form"><h3>${t('contact_h')}</h3><p class="muted">${t('contact_p')}</p>
<form id="contactf" novalidate><label for="cm" class="hp">${t('contact_h')}</label><textarea id="cm" maxlength="5000" placeholder="${t('contact_ph')}"></textarea>
<input class="hp" id="chp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="err" id="cmerr"></div><button class="btn" type="submit">${t('send')}</button><div class="okmsg" id="cmok" role="status"></div></form></div>`},

account(){const u=me();
if(!u)return`<div class="narrow"><div class="card"><h2>${acctTab==='in'?t('signin'):t('create_acct_h')}</h2>
<div class="tabs"><button data-act="tab" data-t="in" class="${acctTab==='in'?'on':''}">${t('signin')}</button><button data-act="tab" data-t="up" class="${acctTab==='up'?'on':''}">${t('create_acct')}</button></div>
<form id="authf" novalidate>${acctTab==='up'?`<label for="un" style="margin-top:0">${t('uname')}</label><input id="un" type="text" autocomplete="username">`:''}
<label for="em" ${acctTab==='in'?'style="margin-top:0"':''}>${t('email')}</label><input id="em" type="email" autocomplete="email">
<label for="pw">${acctTab==='up'?t('pw8'):t('pw')}</label><input id="pw" type="password" autocomplete="${acctTab==='in'?'current-password':'new-password'}">
<div class="err" id="aerr"></div><button class="btn" style="width:100%" type="submit">${acctTab==='in'?t('signin'):t('create_acct')}</button></form></div></div>`;
const n=(u.tests||[]).length;
return`<h1 style="font-size:32px">${t('acct_h')}</h1>
<div class="card"><h3>${t('profile')}</h3><p class="muted">${n===1?t('saved_1'):t('saved_n',{n})}</p>
<form id="prof" novalidate><label for="pn">${t('uname')}</label><input id="pn" type="text" value="${esc(u.name)}"><label for="pe">${t('email')}</label><input id="pe" type="email" value="${esc(u.email)}"><div class="err" id="perr"></div><button class="btn" type="submit">${t('save')}</button></form></div>
<div class="card"><h3>${t('chpw')}</h3><form id="cpf" novalidate><label for="op">${t('curpw')}</label><input id="op" type="password" autocomplete="current-password"><label for="np">${t('newpw')}</label><input id="np" type="password" autocomplete="new-password"><div class="err" id="cperr"></div><button class="btn" type="submit">${t('updpw')}</button></form></div>
<div class="card"><h3>${t('session')}</h3><button class="btn alt" data-act="logout">${t('signout')}</button></div>
<div class="card" style="border-color:var(--bad)"><h3>${t('del_h')}</h3><p class="muted">${t('del_p')}</p><button class="btn danger" data-act="delacct">${t('del_btn')}</button></div>`}
};

/* ---------- Test runner ---------- */
function qView(){const r=run,q=r.qs[r.i],a=r.ans[r.i],shown=r.mode==='tutor'&&r.done[r.i];
return`<div class="card"><div class="q-top"><span>${t('q_of',{i:r.i+1,n:r.qs.length})}</span><span class="pill">${esc(sub(q.subj))}</span></div>
<div class="prog"><div style="width:${(r.i+(shown?1:0))/r.qs.length*100}%"></div></div>
${stemHTML(q)}
${q.opts.map((o,k)=>{let c='opt';if(shown){if(k===q.ans)c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel';return`<button class="${c}" data-act="pick" data-k="${k}" ${shown?'disabled':''}><b>${L[k]}</b><span>${esc(o)}</span></button>`}).join('')}
${shown?expHTML(q,a):''}
<div class="row sp"><button class="btn alt" data-act="quit">${t('end')}</button><span>
${r.mode==='tutor'&&!shown?`<button class="btn" data-act="check" ${a==null?'disabled':''}>${t('submit')}</button>`:(r.i<r.qs.length-1?`<button class="btn" data-act="next" ${a==null?'disabled':''}>${t('next')}</button>`:`<button class="btn" data-act="finish" ${a==null?'disabled':''}>${t('finish')}</button>`)}</span></div></div>`}
function begin(r){run=r;render(qView);window.scrollTo(0,0)}
function startTest(){
const subjs=[...document.querySelectorAll('#subjs input:checked')].map(i=>i.value),pool=BANK.filter(q=>subjs.includes(q.subj));
if(!subjs.length)return $('#cerr').textContent=t('err_topic');
const n=Math.min(Math.max(1,parseInt($('#n').value)||0),pool.length);
begin({qs:shuffle(pool).slice(0,n),i:0,ans:[],done:[],mode:$('#mode').value,subjs,from:'create'})}
const startSingle=id=>begin({qs:[BANK[id]],i:0,ans:[],done:[],mode:'tutor',subjs:[BANK[id].subj],from:'search'});
function finish(){const r=run,score=r.qs.filter((q,i)=>r.ans[i]===q.ans).length;
const T={date:Date.now(),mode:r.mode,subjs:r.subjs,score,items:r.qs.map((q,i)=>({id:q.id,subj:q.subj,ans:q.ans,pick:r.ans[i]??null}))};
addTest(T);run=null;render(()=>results(T,true));window.scrollTo(0,0)}
function itemHTML(x,i){const q='id' in x?BANK[x.id]:null;
 if(!q)return`<div class="card"><div class="q-top"><span>${t('question',{i:i+1})}</span><span class="pill">${esc(sub(x.subj))}</span></div><p style="font-weight:700">${esc(x.q)}</p>
${x.opts.map((o,k)=>`<div class="opt ${k===x.ans?'ok':k===x.pick?'no':''}" style="cursor:default"><b>${L[k]}</b><span>${esc(o)}</span></div>`).join('')}<div class="exp">${esc(x.exp)}</div></div>`;
 return`<div class="card"><div class="q-top"><span>${t('question',{i:i+1})}</span><span class="pill">${esc(sub(q.subj))}</span></div>${stemHTML(q)}
${q.opts.map((o,k)=>`<div class="opt ${k===q.ans?'ok':k===x.pick?'no':''}" style="cursor:default"><b>${L[k]}</b><span>${esc(o)}${k===x.pick?' '+t('yours'):''}${k===q.ans?' '+t('is_correct'):''}</span></div>`).join('')}
${expHTML(q,x.pick)}</div>`}
function results(T,fresh){const pct=Math.round(100*T.score/T.items.length);
return`${fresh?(me()?`<div class="notice" style="border-color:var(--good)">${t('saved_notice')}</div>`:`<div class="notice">${t('unsaved_notice')}</div>`):''}
<div class="card"><h1 style="font-size:28px">${t('results')}</h1><div class="score">${pct}%</div><p class="muted">${t('of_correct',{s:T.score,n:T.items.length,m:T.mode==='tutor'?t('tutor'):t('test')})}</p>
<div class="row"><a class="btn" href="#/create">${t('new_test')}</a><a class="btn alt" href="#/prior">${t('nav_prior')}</a></div></div>
<h2>${t('review')}</h2>`+T.items.map(itemHTML).join('')}

/* ---------- Search ---------- */
function doSearch(){const v=sQuery.trim().toLowerCase(),el=$('#sres');if(!el)return;
 const r=BANK.filter(q=>!v||[q.q,q.subj,sub(q.subj),q.ask,q.opts.join(' ')].join(' ').toLowerCase().includes(v));
 el.innerHTML=r.length?`<p class="muted">${r.length===1?t('result_1'):t('results_n',{n:r.length})}</p>`+r.map(q=>{const open=sOpen===q.id;
  return`<div class="card qprev${open?' open':''}" data-act="sq" data-id="${q.id}" role="button" tabindex="0" aria-expanded="${open}"><span class="pill">${esc(sub(q.subj))}</span>
${open?`<div style="margin-top:12px">${stemHTML(q)}${q.opts.map((o,k)=>`<div class="po"><b>${L[k]}.</b><span>${esc(o)}</span></div>`).join('')}<p class="hint">${t('s_open')}</p></div>`
:`<p class="pv">${esc(preview(q.q))}</p><p class="more">${t('s_more')}</p>`}</div>`}).join('')
 :`<div class="card"><h3>${t('no_match')}</h3><p class="muted" style="margin:0">${t('no_match_p')}</p></div>`}

/* ---------- Router ---------- */
function chrome(){const k=curKey;document.documentElement.lang=lang==='zh'?'zh-CN':lang;langUI();
 const nk=PARENT[k]||k;
 $('#nav').innerHTML=NAV.map(([id,l])=>`<a href="#/${id}" class="${id===nk?'on':''}">${id==='account'&&me()?esc(me().name):t(l)}</a>`).join('');
 $('#menu').textContent=t('menu');
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
 document.querySelectorAll('.flinks a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+k));
 const nav=NAV.find(n=>n[0]===k);document.title=k==='home'?'Next Level Bank':t(nav?nav[1]:TITLES[k])+' – Next Level Bank'}
let curKey='home';
function route(){const key=(location.hash.replace(/^#\/?/,'')||'home').split('/')[0];curKey=pages[key]?key:'home';
run=null;if(curKey!=='search')sOpen=null;
$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
chrome();render(pages[curKey],curKey==='search'?doSearch:null);window.scrollTo(0,0)}

/* ---------- Forms (FormSubmit) ---------- */
async function sendForm(data){
 const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...data,_template:'table',_captcha:'false'})});
 const j=await r.json().catch(()=>({}));if(!r.ok||String(j.success)!=='true')throw new Error(j.message||'send failed')}
async function submitForm(form,data,errId,okId){const btn=form.querySelector('button[type=submit]'),label=btn.textContent;
 btn.disabled=true;btn.textContent=t('sending');$('#'+errId).textContent='';
 try{await sendForm(data);form.reset();$('#'+okId).textContent=t('sent_ok')}catch{$('#'+errId).textContent=t('sent_err')}
 btn.disabled=false;btn.textContent=label}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
if(e.target.closest('#langbtn')){const m=$('#langmenu'),o=m.hidden;m.hidden=!o;$('#langbtn').setAttribute('aria-expanded',o);if(o)m.querySelector('[aria-selected=true]').focus();return}
if(!e.target.closest('#langmenu'))closeLang();
const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='lang'){closeLang();setLang(b.dataset.l);$('#langbtn').focus()}
else if(a==='start')startTest();
else if(a==='all')document.querySelectorAll('#subjs input:not(:disabled)').forEach(i=>i.checked=b.dataset.v==='1');
else if(a==='pick'){run.ans[run.i]=+b.dataset.k;app.innerHTML=qView()}
else if(a==='check'){run.done[run.i]=true;app.innerHTML=qView()}
else if(a==='next'){run.i++;app.innerHTML=qView();window.scrollTo(0,0)}
else if(a==='finish')finish();
else if(a==='quit'){if(confirm(t('c_end'))){const to=run.from==='search'?'#/search':'#/create';run=null;if(location.hash===to)route();else location.hash=to}}
else if(a==='review'){const T=getTests()[+b.dataset.i];render(()=>results(T,false));window.scrollTo(0,0)}
else if(a==='sq'){const id=+b.dataset.id;if(sOpen===id){sOpen=null;startSingle(id)}else{sOpen=id;doSearch();const el=document.querySelector(`.qprev[data-id="${id}"]`);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'})}}}
else if(a==='tab'){acctTab=b.dataset.t;render(pages.account)}
else if(a==='logout'){LS.set('qb_session',null);toast(t('t_out'));route()}
else if(a==='delacct'){if(confirm(t('c_del'))){const u=users();delete u[me().email];saveUsers(u);LS.set('qb_session',null);toast(t('t_del'));route()}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#langmenu').hidden){closeLang();$('#langbtn').focus()}
 const q=e.target.closest&&e.target.closest('.qprev');if(q&&(e.key==='Enter'||e.key===' ')){e.preventDefault();q.click()}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){sQuery=e.target.value;sOpen=null;doSearch()}});
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id,v=i=>($('#'+i)||{}).value||'',err=(i,m)=>$('#'+i).textContent=m,okE=s=>/^\S+@\S+\.\S+$/.test(s);
if(id==='authf'){const em=v('em').trim().toLowerCase(),pw=v('pw'),all=users();
 if(!okE(em))return err('aerr',t('e_email'));
 if(acctTab==='up'){const nm=v('un').trim();if(!nm)return err('aerr',t('e_uname'));if(pw.length<8)return err('aerr',t('e_pw8'));if(all[em])return err('aerr',t('e_exists'));
  all[em]={name:nm,email:em,hash:await sha(pw),tests:SS.get('qb_guest',[])};saveUsers(all);LS.set('qb_session',em);SS.set('qb_guest',[]);toast(t('t_created'))}
 else{if(!all[em]||all[em].hash!==await sha(pw))return err('aerr',t('e_wrong'));LS.set('qb_session',em);toast(t('t_in'))}
 route()}
else if(id==='prof'){const u=me(),nm=v('pn').trim(),em=v('pe').trim().toLowerCase(),all=users();
 if(!nm)return err('perr',t('e_uname'));if(!okE(em))return err('perr',t('e_email'));if(em!==u.email&&all[em])return err('perr',t('e_inuse'));
 delete all[u.email];all[em]={...u,name:nm,email:em};saveUsers(all);LS.set('qb_session',em);toast(t('t_saved'));route()}
else if(id==='cpf'){const u=me(),all=users();
 if(u.hash!==await sha(v('op')))return err('cperr',t('e_cur'));if(v('np').length<8)return err('cperr',t('e_new8'));
 all[u.email].hash=await sha(v('np'));saveUsers(all);toast(t('t_pw'));route()}
else if(id==='tutf'){$('#tok').textContent='';const tt=v('tt').trim(),te=v('te').trim(),ts=v('ts').trim();
 if(!tt||!te||!ts)return err('terr',t('err_fields'));if(!okE(te))return err('terr',t('e_email'));
 if(v('thp'))return void($('#tok').textContent=t('sent_ok'));
 await submitForm(e.target,{_subject:'Tutoring request: '+tt.slice(0,80),Title:tt,email:te,Subject:ts,Language:lang},'terr','tok')}
else if(id==='contactf'){$('#cmok').textContent='';const m=v('cm').trim();
 if(!m)return err('cmerr',t('err_msg'));
 if(v('chp'))return void($('#cmok').textContent=t('sent_ok'));
 await submitForm(e.target,{_subject:'Anonymous message from Next Level Bank',Message:m,Language:lang},'cmerr','cmok')}
});
$('#menu').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',o)};
$('#yr').textContent=new Date().getFullYear();
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
