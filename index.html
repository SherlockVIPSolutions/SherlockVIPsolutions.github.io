C:`Short-term monitoring may be appropriate for mildly atypical, flat lesions with no history of change. A changing lesion with several concerning features needs a tissue diagnosis now.`,
D:`A superficial shave biopsy can cut through the base of the lesion, making it impossible to determine the true Breslow depth and therefore the correct margins and stage.`,
E:`Wide local excision with 1- to 2-cm margins (based on Breslow thickness) is the definitive treatment for confirmed melanoma. Doing it before diagnosis is inappropriate because the required margin is unknown and it can disrupt lymphatic mapping.`},
k:`A pigmented lesion with features of melanoma should undergo excisional biopsy with 1- to 3-mm margins so that Breslow thickness can be measured; definitive margins are based on that thickness.`},

{s:'Endocrinology',
q:`A 56-year-old woman comes to the office for follow-up after an emergency department visit for a left ureteral stone that passed on its own. She has had fatigue and constipation for several months. She has no history of cancer. She takes a daily multivitamin and no thiazide diuretics or lithium. Vital signs and physical examination are normal. Stone analysis showed calcium oxalate. Laboratory results are as follows:`,
lab:[['Calcium','11.4 mg/dL'],['Phosphorus','2.2 mg/dL'],['Albumin','4.1 g/dL'],['Creatinine','0.8 mg/dL'],['Parathyroid hormone (intact)','112 pg/mL (reference: 10–65)'],['25-hydroxyvitamin D','34 ng/mL'],['24-hour urine calcium','380 mg/24 hr (reference: 100–300)']],
ask:`Which of the following is the most likely cause of this patient's hypercalcemia?`,
o:['Familial hypocalciuric hypercalcemia','Humoral hypercalcemia of malignancy','Parathyroid adenoma','Secondary hyperparathyroidism','Sarcoidosis'],a:2,
e:[`This patient has hypercalcemia, hypophosphatemia, and an elevated parathyroid hormone (PTH) level, consistent with primary hyperparathyroidism. A single parathyroid adenoma causes about 85% of cases; the rest are due to hyperplasia of all 4 glands (associated with MEN1 and MEN2A) or, rarely, carcinoma. PTH increases calcium reabsorption and phosphate excretion in the kidney, bone resorption, and activation of vitamin D. Despite increased tubular reabsorption, the high filtered calcium load causes hypercalciuria and calcium stones.`,
`Parathyroidectomy is indicated for all symptomatic patients, including those with kidney stones, and for asymptomatic patients who meet criteria (eg, serum calcium >1 mg/dL above the upper limit of normal, osteoporosis or vertebral fracture, creatinine clearance <60 mL/min, hypercalciuria, or age <50). A sestamibi scan or neck ultrasound localizes the gland before surgery but is not used to make the diagnosis.`],
w:{A:`Familial hypocalciuric hypercalcemia is caused by an inactivating mutation of the calcium-sensing receptor and produces mild hypercalcemia with normal or mildly high PTH. Urine calcium is low (calcium/creatinine clearance ratio <0.01), whereas this patient has hypercalciuria. It does not require surgery.`,
B:`Humoral hypercalcemia of malignancy is caused by PTH-related peptide from squamous cell, kidney, breast, and other cancers. Intact PTH is suppressed.`,
D:`Secondary hyperparathyroidism is a compensatory rise in PTH in response to low calcium, usually from vitamin D deficiency or chronic kidney disease. Serum calcium is low or normal, not high.`,
E:`Sarcoidosis and other granulomatous diseases cause hypercalcemia through macrophage production of 1,25-dihydroxyvitamin D. PTH is suppressed.`},
k:`Hypercalcemia with an elevated or inappropriately normal PTH indicates primary hyperparathyroidism, most often from a parathyroid adenoma; symptomatic disease (eg, kidney stones) is an indication for parathyroidectomy.`},

{s:'ENT',
q:`A 22-year-old man comes to the emergency department with 4 days of sore throat that has become much worse on the right side. He has trouble swallowing his saliva and can open his mouth only partway. His voice sounds muffled. He has no shortness of breath. Temperature is 38.9 C (102 F), pulse is 104/min, and oxygen saturation is 99% on room air. He is sitting upright and spitting saliva into a cup. The distance between his upper and lower incisors with maximal opening is 2 cm. The right soft palate and the area in front of the right tonsil are swollen, and the uvula points to the left. Both tonsils are red with exudate. There are tender lymph nodes in the front of the right side of the neck. There is no stridor, and the back wall of the pharynx looks normal. He can move his neck through a full range of motion.`,
ask:`Which of the following is the most likely diagnosis?`,
o:['Epiglottitis','Infectious mononucleosis','Peritonsillar abscess','Retropharyngeal abscess','Streptococcal pharyngitis without abscess'],a:2,
e:[`Peritonsillar abscess is the most common deep neck infection in adolescents and young adults. It usually complicates tonsillopharyngitis, when infection spreads into the space between the tonsil capsule and the pharyngeal muscle. Infections are usually polymicrobial (group A Streptococcus, Streptococcus anginosus group, Staphylococcus aureus, and anaerobes such as Fusobacterium). Key findings are severe one-sided throat pain, limited mouth opening (trismus, from irritation of the nearby pterygoid muscles), a muffled voice, drooling, and one-sided swelling of the soft palate with the uvula pushed to the opposite side.`,
`The diagnosis is clinical, although intraoral ultrasound or CT can help when the examination is limited. Treatment is drainage, by needle aspiration or incision and drainage, plus antibiotics that cover streptococci and anaerobes (eg, ampicillin-sulbactam or clindamycin). Tonsillectomy is reserved for recurrent abscesses or failed drainage.`],
w:{A:`Epiglottitis causes rapidly progressive fever, sore throat, drooling, and a muffled voice, often with stridor and a forward-leaning posture. The oropharynx usually looks unremarkable, and it does not cause one-sided palatal swelling, uvular deviation, or trismus.`,
B:`Infectious mononucleosis (Epstein-Barr virus) causes exudative tonsillitis on both sides, fatigue, lymph nodes in the back of the neck, and splenomegaly. Tonsillar swelling is symmetric, and trismus and uvular deviation are not expected.`,
D:`Retropharyngeal abscess occurs mostly in children younger than 5 and causes neck stiffness, pain with neck extension, and bulging of the back wall of the pharynx. This patient's posterior pharynx and neck movement are normal.`,
E:`Uncomplicated strep throat causes fever, tonsillar exudate, and tender front neck nodes, but swelling is symmetric. Trismus, drooling, and uvular deviation indicate that infection has spread beyond the tonsil.`},
k:`Peritonsillar abscess presents with severe one-sided sore throat, trismus, a muffled voice, drooling, and palatal swelling with the uvula pushed to the opposite side; treat with drainage plus antibiotics.`},

{s:'ENT',
q:`A 74-year-old man comes to the office with 3 weeks of severe left ear pain that is worse at night and keeps him awake. He has had pus draining from the ear for 2 weeks despite using ciprofloxacin-dexamethasone ear drops prescribed at an urgent care clinic. He has type 2 diabetes mellitus, and his most recent hemoglobin A1c was 10.2%. Temperature is 37.6 C (99.7 F). Otoscopy shows a swollen left ear canal with pus and a patch of red, bumpy tissue on the floor of the canal, about halfway in. The eardrum is intact. Pulling on the outer ear causes severe pain. There are no blisters on the ear or in the canal. Facial movement is normal and symmetric. ESR is 92 mm/hr, and CRP is 6.4 mg/dL.`,
ask:`Which of the following is the most likely diagnosis?`,
o:['Acute otitis media with tympanic membrane perforation','Cholesteatoma','Necrotizing (malignant) otitis externa','Otomycosis','Herpes zoster oticus'],a:2,
e:[`Necrotizing (malignant) otitis externa is an invasive infection of the ear canal that spreads to the temporal bone and skull base. It occurs mostly in older adults with diabetes or other immunocompromise and is caused by Pseudomonas aeruginosa in more than 90% of cases. Features include severe, persistent ear pain that is often worse at night, drainage that does not respond to ear drops, granulation tissue at the junction of the bony and cartilaginous canal, and a markedly elevated ESR. Progression can cause cranial nerve palsies (the facial nerve first), skull base osteomyelitis, and venous sinus thrombosis.`,
`Evaluation includes CT or MRI of the temporal bone to define bone involvement and culture of the drainage (with biopsy of the granulation tissue to exclude cancer). Treatment is prolonged (6–8 weeks) antipseudomonal therapy, usually intravenous at first (eg, cefepime or piperacillin-tazobactam) or oral ciprofloxacin in milder cases, together with tight glucose control. ESR is used to monitor response.`],
w:{A:`Acute otitis media causes ear pain and fever, and perforation can cause drainage with relief of pain. This patient's eardrum is intact, and pain with pulling on the ear points to the ear canal.`,
B:`Cholesteatoma is a growth of skin cells in the middle ear that causes painless, chronic, foul-smelling drainage and hearing loss. It does not cause severe pain or a markedly elevated ESR.`,
D:`Otomycosis (fungal otitis externa, usually Aspergillus or Candida) often follows prolonged antibiotic drops and causes itching and discharge with visible fungal debris. It does not cause granulation tissue, severe night pain, or high inflammatory markers.`,
E:`Herpes zoster oticus (Ramsay Hunt syndrome) causes severe ear pain followed by blisters on the ear or in the canal and weakness of the face on the same side. This patient has no blisters and normal facial movement.`},
k:`Severe ear pain with drainage that does not respond to drops, canal granulation tissue, and a high ESR in an older patient with diabetes suggests necrotizing otitis externa (usually Pseudomonas); obtain temporal bone imaging and start antipseudomonal antibiotics.`},

{s:'Gastroenterology',
q:`A 67-year-old woman is brought to the emergency department because of 2 days of fever, chills, and right upper abdominal pain. She has noticed dark urine since yesterday. Over the past year, she has had several episodes of right upper abdominal pain after meals that went away within a few hours. Temperature is 39.2 C (102.6 F), blood pressure is 104/66 mm Hg, and pulse is 112/min. She is alert and oriented. The whites of her eyes are yellow. The right upper abdomen is tender without rebound, and she does not stop inhaling when it is pressed deeply. Laboratory and imaging results are as follows:`,
lab:[['Leukocytes','17,800/mm3'],['Total bilirubin','5.8 mg/dL'],['Direct bilirubin','4.6 mg/dL'],['Alkaline phosphatase','410 U/L'],['AST','160 U/L'],['ALT','180 U/L'],['Lipase','42 U/L (reference: <60)'],['Right upper quadrant ultrasound','Gallstones; common bile duct 11 mm; normal gallbladder wall; no fluid around the gallbladder']],
ask:`Which of the following is the most likely diagnosis?`,
o:['Acute acalculous cholecystitis','Acute calculous cholecystitis','Acute cholangitis','Choledocholithiasis without infection','Primary sclerosing cholangitis'],a:2,
e:[`This patient has fever, right upper abdominal pain, and jaundice with a dilated common bile duct and cholestatic liver tests, consistent with acute cholangitis. Cholangitis is a bacterial infection of an obstructed biliary tree, most often from a common bile duct stone. Other causes include malignant strictures and prior biliary procedures. Organisms are usually enteric gram-negative bacilli (Escherichia coli, Klebsiella) and enterococci. Low blood pressure and confusion indicate severe disease.`,
`Management includes blood cultures, intravenous fluids, and broad-spectrum antibiotics (eg, piperacillin-tazobactam, or ceftriaxone plus metronidazole), followed by biliary drainage, usually by endoscopic retrograde cholangiopancreatography (ERCP) with stone removal. ERCP should be done within 24 hours in severe cases or when antibiotics are not working, and within 24–48 hours in others. Cholecystectomy is performed during the same admission to prevent recurrence.`],
w:{A:`Acalculous cholecystitis occurs in critically ill patients (eg, after major surgery or burns, or on prolonged intravenous nutrition) and results from gallbladder stasis and ischemia. Ultrasound shows gallbladder wall thickening and surrounding fluid without stones. Marked jaundice and bile duct dilation are not typical.`,
B:`Acute calculous cholecystitis causes right upper abdominal pain, fever, and leukocytosis with gallbladder wall thickening and surrounding fluid on ultrasound. Bilirubin is usually normal or only mildly elevated because the cystic duct, not the common bile duct, is blocked.`,
D:`Choledocholithiasis causes biliary pain and cholestatic liver tests with a dilated common bile duct. Fever, chills, and marked leukocytosis indicate infection on top of the obstruction, which requires antibiotics and urgent drainage.`,
E:`Primary sclerosing cholangitis is a chronic scarring disease of the bile ducts strongly associated with ulcerative colitis. It causes fatigue, itching, and a cholestatic pattern, with multiple strictures on cholangiography rather than gallstones.`},
k:`Fever, right upper abdominal pain, and jaundice with a dilated common bile duct indicate acute cholangitis; treat with IV fluids, broad-spectrum antibiotics, and ERCP for drainage.`},

{s:'Gastroenterology',
q:`A 29-year-old woman comes to the office because of 8 months of intermittent bloating, loose stools, and fatigue. Her symptoms do not change when she avoids dairy. She has had iron deficiency anemia for 2 years that has not improved despite taking oral ferrous sulfate daily as directed; her menstrual periods are light. Her sister has type 1 diabetes mellitus. Body mass index is 19 kg/m2. The abdomen is soft and nontender. Stool testing for occult blood is negative. Laboratory results are as follows:`,
lab:[['Hemoglobin','10.1 g/dL'],['Mean corpuscular volume','74 µm3'],['Ferritin','6 ng/mL'],['Albumin','3.4 g/dL'],['ALT','58 U/L'],['AST','49 U/L'],['TSH','2.1 µU/mL']],
ask:`Which of the following is the most appropriate next step in diagnosis?`,
o:['Anti–tissue transglutaminase IgA antibody and total serum IgA','Colonoscopy with random biopsies','Hydrogen breath testing','Fecal calprotectin','HLA-DQ2 and HLA-DQ8 genotyping'],a:0,
e:[`This patient has chronic diarrhea and bloating, iron deficiency anemia that does not respond to oral iron, low albumin, and mildly elevated aminotransferases. Together, these findings suggest celiac disease, an immune reaction to gluten in genetically susceptible people. Damage to the villi of the duodenum, where iron is absorbed, explains the failure of oral iron. Celiac disease is associated with other autoimmune conditions, such as type 1 diabetes and autoimmune thyroid disease, in the patient or her relatives.`,
`The first test is anti–tissue transglutaminase (tTG) IgA, which is highly sensitive and specific. Total IgA should be measured at the same time because IgA deficiency is 10–15 times more common in celiac disease and causes false-negative results; IgG-based tests are used in that case. Testing must be done while the patient is still eating gluten. Positive serology is confirmed with upper endoscopy and duodenal biopsies showing flattened villi, deepened crypts, and increased intraepithelial lymphocytes. Treatment is a lifelong gluten-free diet.`],
w:{B:`Colonoscopy with random biopsies diagnoses microscopic colitis (in older women with watery diarrhea) or inflammatory bowel disease. Celiac disease affects the small intestine, and the diagnostic biopsy is taken from the duodenum during upper endoscopy.`,
C:`Hydrogen breath testing detects carbohydrate malabsorption (eg, lactose intolerance) and bacterial overgrowth. It would not explain the iron deficiency that does not respond to oral iron or the elevated aminotransferases.`,
D:`Fecal calprotectin is a marker of intestinal inflammation used to distinguish inflammatory bowel disease from irritable bowel syndrome. It is not specific for celiac disease.`,
E:`HLA-DQ2/DQ8 is present in nearly everyone with celiac disease, so a negative result effectively rules it out. However, about 30%–40% of the general population carries these genes, so a positive result is not diagnostic. Genotyping is reserved for unclear cases or patients already on a gluten-free diet.`},
k:`Suspect celiac disease with chronic diarrhea or bloating and iron deficiency that does not respond to oral iron; test with tTG-IgA plus total IgA while the patient eats gluten, then confirm with duodenal biopsy.`},

{s:'Gynecology',
q:`A 27-year-old woman is brought to the emergency department 3 hours after the sudden onset of severe left lower abdominal pain that began while she was running. The pain is constant with intermittent sharp worsening, and she has vomited 3 times. Six months ago, a 6-cm left ovarian mature cystic teratoma was found incidentally, and she chose observation. Her last menstrual period was 2 weeks ago. Temperature is 37.4 C (99.3 F), blood pressure is 132/84 mm Hg, and pulse is 108/min. The left lower abdomen is tender with voluntary guarding. Pelvic examination shows a tender left adnexal mass. Urine hCG is negative. Hemoglobin is 13.2 g/dL, and urinalysis is normal. Transvaginal ultrasound shows an enlarged, swollen 8-cm left ovary containing a complex cyst, with follicles pushed to the edges; Doppler blood flow to the left ovary is reduced but present. There is a small amount of free fluid in the pelvis.`,
ask:`Which of the following is the most likely diagnosis?`,
o:['Ectopic pregnancy','Ovarian torsion','Ruptured hemorrhagic ovarian cyst','Tubo-ovarian abscess','Ureteral stone'],a:1,
e:[`Ovarian torsion is twisting of the ovary on its supporting ligaments. Twisting first blocks venous and lymphatic outflow and then arterial inflow, causing swelling, ischemia, and eventually necrosis. The greatest risk factor is an ovarian mass of 5 cm or more, such as a mature cystic teratoma, which acts as a lead point. Torsion typically causes sudden, severe one-sided pelvic pain, often after exertion, with nausea and vomiting.`,
`Ultrasound shows an enlarged, swollen ovary with follicles pushed to the periphery, often with an associated mass. Doppler flow is often reduced, but the presence of flow does not rule out torsion because the ovary has a dual blood supply. When torsion is suspected, the treatment is prompt laparoscopy with untwisting of the ovary to preserve its function, plus removal of the cyst. Removing the ovary is reserved for one that is clearly dead or suspected to be malignant.`],
w:{A:`Ectopic pregnancy can cause sudden one-sided pelvic pain and internal bleeding, but a negative pregnancy test effectively rules it out.`,
C:`A ruptured hemorrhagic cyst also causes sudden one-sided pain, usually in the second half of the cycle, often after intercourse or exercise. Ultrasound shows a cyst with a lacy internal pattern and moderate free fluid, and hemoglobin may fall. It does not cause an enlarged, swollen ovary with follicles pushed to the edges.`,
D:`Tubo-ovarian abscess is a complication of pelvic inflammatory disease and presents with fever, pelvic pain, leukocytosis, and a complex multilocular mass. Onset is gradual rather than sudden with exertion.`,
E:`A ureteral stone causes colicky flank pain that spreads to the groin, often with blood in the urine. This patient's urinalysis is normal and her ovary is abnormal.`},
k:`Sudden severe one-sided pelvic pain with vomiting in a woman with an adnexal mass ≥5 cm suggests ovarian torsion; normal Doppler flow does not rule it out, and treatment is urgent laparoscopic detorsion.`},

{s:'Hematology',
q:`A 41-year-old woman comes to the office because of 4 months of fatigue, shortness of breath when climbing stairs, and trouble concentrating at work. Her menstrual periods have become heavier over the past year, lasting 8 days with clots. She eats a varied diet that includes meat. She has no chronic illnesses and takes no medications. Her parents emigrated from southern Italy. Blood pressure is 112/70 mm Hg, and pulse is 98/min. Examination shows pale conjunctivae and cracks at the corners of the mouth. Stool testing for occult blood is negative. Laboratory results are as follows:`,
lab:[['Hemoglobin','9.2 g/dL'],['Mean corpuscular volume','71 µm3'],['Red blood cell count','3.6 million/mm3 (reference: 4.0–5.2)'],['Red cell distribution width','18.5% (reference: 11.5%–14.5%)'],['Reticulocytes','0.6%'],['Serum iron','22 µg/dL (reference: 50–170)'],['Total iron-binding capacity','470 µg/dL (reference: 250–400)'],['Transferrin saturation','5%'],['Ferritin','5 ng/mL (reference: 15–200)']],
ask:`Which of the following is the most likely cause of this patient's anemia?`,
o:['Anemia of chronic disease','Beta-thalassemia minor','Iron deficiency','Lead poisoning','Sideroblastic anemia'],a:2,
e:[`This patient has a microcytic anemia with a low reticulocyte count, low ferritin, low serum iron, high total iron-binding capacity (TIBC), low transferrin saturation, and a high red cell distribution width (RDW), which is diagnostic of iron deficiency. Ferritin reflects iron stores, and a level below 30 ng/mL is highly specific for iron deficiency. As stores fall, the liver makes more transferrin, raising the TIBC. Heavy menstrual bleeding is the most common cause in premenopausal women.`,
`Treatment is oral iron (eg, ferrous sulfate once daily or every other day, which improves absorption). Intravenous iron is used for intolerance, malabsorption, or ongoing losses that oral iron cannot keep up with. The cause of her heavy bleeding (eg, fibroids, adenomyosis) should be evaluated. In men and postmenopausal women, iron deficiency calls for evaluation for gastrointestinal blood loss.`],
w:{A:`Anemia of chronic disease is caused by inflammation-driven iron trapping. It is usually normocytic but can be mildly microcytic. Ferritin is normal or high and TIBC is low or normal. This patient has no chronic inflammatory condition.`,
B:`Beta-thalassemia minor, common in people of Mediterranean descent, causes a mild microcytic anemia with a normal or high red cell count, a normal RDW, and normal iron studies (MCV/RBC count <13). Her ratio is about 20, and her iron studies are clearly abnormal.`,
D:`Lead poisoning blocks heme synthesis and causes microcytic anemia with basophilic stippling, abdominal pain, and neuropathy. Iron stores are normal or increased.`,
E:`Sideroblastic anemia results from defective heme synthesis (inherited, or from alcohol, lead, isoniazid, or copper deficiency). Serum iron and ferritin are high, and the bone marrow shows ringed sideroblasts.`},
k:`Iron deficiency anemia shows low ferritin, low serum iron, high TIBC, low transferrin saturation, and high RDW. Anemia of chronic disease has normal or high ferritin with low TIBC, and thalassemia minor has normal iron studies with MCV/RBC <13.`},

{s:'Infectious Disease',
q:`A 20-year-old college student is brought to the emergency department by her roommate because of 12 hours of fever, severe headache, vomiting, and increasing drowsiness. She lives in a campus dormitory. She has no medical problems or drug allergies, and her vaccination history is unknown. Temperature is 39.6 C (103.3 F), blood pressure is 96/58 mm Hg, pulse is 124/min, and respirations are 22/min. She is drowsy but can be woken and knows only her name. Bending her neck forward causes pain and resistance. There are scattered purple spots 1–3 mm across on her legs and trunk that do not fade when pressed. There is no papilledema, and there are no focal neurologic deficits. Blood cultures are drawn.`,
ask:`Which of the following is the most appropriate next step in management?`,
o:['Intravenous dexamethasone, ceftriaxone, and vancomycin','Intravenous dexamethasone, ceftriaxone, vancomycin, and ampicillin','Intravenous acyclovir','Intravenous ampicillin and gentamicin','Head CT, followed by lumbar puncture, then antibiotics based on Gram stain'],a:0,
e:[`This patient has fever, headache, neck stiffness, and altered mental status with a petechial rash, which strongly suggests bacterial meningitis caused by Neisseria meningitidis. Dormitory living is a classic risk factor. Bacterial meningitis is an emergency, and antibiotics should be given within 1 hour of arrival. Blood cultures should be drawn and lumbar puncture done promptly, but antibiotics must never be delayed for imaging or lumbar puncture.`,
`For immunocompetent patients aged 2–50 years, empiric therapy is ceftriaxone (or cefotaxime) plus vancomycin to cover N meningitidis and drug-resistant Streptococcus pneumoniae. Dexamethasone given before or with the first antibiotic dose reduces neurologic complications and death in pneumococcal meningitis. Patients with suspected meningococcal disease need droplet precautions for 24 hours after antibiotics are started, and close contacts (roommates, household members) should receive prophylaxis with rifampin, ciprofloxacin, or ceftriaxone.`],
w:{B:`Ampicillin is added to cover Listeria monocytogenes in patients older than 50, pregnant women, newborns, and people with weakened cell-mediated immunity (eg, transplant recipients, long-term steroid use). This healthy 20-year-old does not need Listeria coverage.`,
C:`Acyclovir treats herpes simplex encephalitis, which causes fever, confusion, and focal findings (eg, seizures, personality change). It may be added when encephalitis is suspected but does not treat this patient's likely meningococcal infection.`,
D:`Ampicillin plus gentamicin (or cefotaxime) is the empiric regimen for newborn meningitis, covering group B Streptococcus, Escherichia coli, and Listeria. It does not adequately cover resistant pneumococci in adults.`,
E:`Head CT before lumbar puncture is indicated for immunocompromise, known central nervous system disease, new seizure, papilledema, focal deficits, or a severely reduced level of consciousness. When CT is needed, antibiotics and dexamethasone are given first, right after blood cultures.`},
k:`In suspected bacterial meningitis, draw blood cultures and give dexamethasone plus ceftriaxone and vancomycin immediately, without waiting for CT or lumbar puncture; add ampicillin only for patients at risk for Listeria.`},

{s:'Infectious Disease',
q:`A 35-year-old man comes to the office because of a rash on his right thigh that has been slowly growing for 5 days. Two weeks ago, he went camping in western Massachusetts. He does not remember a tick bite. He has had fatigue, a mild headache, and muscle aches, but no palpitations, shortness of breath, facial weakness, or joint swelling. Temperature is 37.8 C (100 F), blood pressure is 122/76 mm Hg, and pulse is 74/min and regular. On the right thigh, there is a 12-cm round, warm, nontender, red patch with a slightly darker center and partial clearing between the center and the edge. It is not scaly. There are mildly enlarged lymph nodes in the right groin. Cardiac, joint, and neurologic examinations are normal.`,
ask:`Which of the following is the most appropriate next step in management?`,
o:['Antibody testing for Borrelia burgdorferi before treatment','Oral doxycycline for 10 days','Intravenous ceftriaxone for 14 days','Topical clotrimazole','A single 200-mg oral dose of doxycycline'],a:1,
e:[`This patient has erythema migrans, the hallmark of early localized Lyme disease, after outdoor exposure in an endemic area (the northeastern United States, mid-Atlantic, and upper Midwest). The rash appears 3–30 days after the bite of an infected Ixodes tick, expands over days to at least 5 cm, and may clear in the center. Many patients do not remember the bite. Fatigue, muscle aches, headache, and low-grade fever are common.`,
`Erythema migrans is a clinical diagnosis, and treatment should be started without testing. Oral doxycycline for 10 days is the treatment of choice; amoxicillin or cefuroxime for 14 days is used in pregnancy or when doxycycline cannot be taken. Untreated, the infection can spread, causing multiple rashes, facial palsy, meningitis, heart block, and later arthritis.`],
w:{A:`Antibody tests are often negative in early Lyme disease because antibodies have not formed yet (sensitivity is about 30%–40% in the first weeks). Testing is useful for suspected later disease without the rash.`,
C:`Intravenous ceftriaxone is reserved for Lyme meningitis or nerve root involvement, heart block with a PR interval >300 msec or higher-degree block, and arthritis that fails oral therapy. This patient has no sign of spread.`,
D:`Tinea corporis is a ring-shaped, scaly, itchy patch with an advancing border that responds to topical antifungals. Erythema migrans is not scaly, grows over days, and comes with systemic symptoms.`,
E:`A single 200-mg dose of doxycycline is used as prevention within 72 hours of removing an engorged Ixodes tick in a highly endemic area. It is not adequate treatment for established infection.`},
k:`Erythema migrans is a clinical diagnosis of early Lyme disease; treat with 10 days of oral doxycycline without testing. IV ceftriaxone is for meningitis, high-degree heart block, or refractory arthritis.`},

{s:'Musculoskeletal',
q:`A 23-year-old man comes to the emergency department 4 hours after falling onto his outstretched right hand while snowboarding. He has pain on the thumb side of his wrist but no numbness or weakness. Examination shows mild swelling of the thumb side of the wrist. There is tenderness in the hollow between the 2 tendons at the base of the thumb on the back of the wrist, and pushing the thumb straight toward the wrist causes pain. Bending the wrist toward the little finger with the thumb tucked into the palm causes only mild discomfort. There is no tenderness over the end of the radius, the fifth metacarpal, or the little-finger side of the wrist. Pulses and capillary refill are normal. Wrist x-rays, including a dedicated scaphoid view, show no fracture or dislocation.`,
ask:`Which of the following is the most appropriate next step in management?`,
o:['Elastic bandage and NSAIDs, with follow-up only if pain persists','Thumb spica immobilization with repeat imaging in 7–14 days','Ulnar gutter splint','Immediate open reduction and internal fixation','Corticosteroid injection into the first dorsal compartment'],a:1,
e:[`This patient's fall onto an outstretched hand, pain on the thumb side of the wrist, tenderness in the anatomic snuffbox, and pain with axial loading of the thumb are highly suggestive of a scaphoid fracture. The scaphoid is the most commonly fractured carpal bone. Initial x-rays miss up to 20%–30% of scaphoid fractures, which often become visible only 1–2 weeks later, after bone resorbs along the fracture line.`,
`Blood enters the scaphoid at its far end and flows backward, so fractures of the waist and near end are at high risk of nonunion and avascular necrosis. Suspected fractures should therefore be treated as fractures with a thumb spica splint and re-imaged in 7–14 days; MRI (or CT) can be done sooner for a definitive answer, which is common for athletes and manual workers. Displaced or proximal fractures need surgery.`],
w:{A:`Treating this as a sprain risks missing a hidden scaphoid fracture, which carries a high risk of nonunion, avascular necrosis, and later wrist arthritis.`,
C:`An ulnar gutter splint immobilizes the fourth and fifth metacarpals and is used for boxer's fractures of the fifth metacarpal, which result from punching. This patient has no pinky-side tenderness.`,
D:`Surgery is indicated for displaced fractures, fractures near the proximal end, and nonunion. It is not indicated without a confirmed fracture.`,
E:`A steroid injection into the first dorsal compartment treats de Quervain tenosynovitis, an overuse condition of the thumb tendons that causes a strongly positive Finkelstein test (pain with the wrist maneuver described). It is not related to acute trauma.`},
k:`Anatomic snuffbox tenderness after a fall onto an outstretched hand should be treated as a scaphoid fracture even when x-rays are normal: apply a thumb spica splint and re-image in 7–14 days or obtain MRI.`},

{s:'Multisystem',
q:`A 19-year-old woman is brought to the emergency department by her roommate 6 hours after she took an unknown number of 500-mg acetaminophen tablets following an argument with her boyfriend. She has had 2 episodes of nausea but no vomiting or abdominal pain. She took no other substances. She has no medical history. Blood pressure is 118/72 mm Hg, pulse is 92/min, and respirations are 16/min. She is alert and tearful. The abdomen is soft and nontender. Laboratory results are as follows:`,
lab:[['Serum acetaminophen (6 hours after ingestion)','180 µg/mL'],['AST','38 U/L'],['ALT','42 U/L'],['Total bilirubin','0.7 mg/dL'],['INR','1.0'],['Creatinine','0.8 mg/dL'],['Bicarbonate','23 mEq/L'],['Salicylate','Undetectable'],['Ethanol','Undetectable'],['Urine hCG','Negative']],
ask:`Which of the following is the most appropriate next step in management?`,
o:['Activated charcoal only','Hemodialysis','N-acetylcysteine','Observation and repeat acetaminophen level in 4 hours','Fomepizole'],a:2,
e:[`Most acetaminophen is processed in the liver by conjugation; a small fraction is converted by cytochrome P450 to the toxic metabolite NAPQI, which is normally neutralized by glutathione. In overdose, glutathione runs out and NAPQI destroys liver cells, especially around the central veins. Early symptoms are mild or absent, and aminotransferases begin to rise 24–36 hours after ingestion, peaking at 72–96 hours. Normal liver tests now therefore do not mean she is safe.`,
`For a single acute ingestion, the need for treatment is decided by plotting a level drawn 4 or more hours after ingestion on the Rumack-Matthew nomogram. In the United States, the treatment line starts at 150 µg/mL at 4 hours and is about 100 µg/mL at 6 hours, so her level of 180 µg/mL requires treatment. N-acetylcysteine (NAC) restores glutathione and nearly always prevents liver injury when started within 8 hours of ingestion. NAC is also given when the time of ingestion is unknown or the level is not available within 8 hours. A psychiatric evaluation is required after medical stabilization.`],
w:{A:`Activated charcoal may be given if a patient arrives within about 1–4 hours of ingestion and can protect her airway. At 6 hours, little drug remains in the gut, and charcoal does not replace NAC when the level is above the treatment line.`,
B:`Hemodialysis is reserved for massive ingestions with very high levels, confusion, and severe metabolic acidosis. This patient has none of these.`,
D:`One level drawn at least 4 hours after an acute ingestion is enough to decide on treatment. Waiting another 4 hours would delay NAC past the 8-hour window in which it works best.`,
E:`Fomepizole blocks alcohol dehydrogenase and is the antidote for methanol and ethylene glycol poisoning, which cause a high anion gap acidosis with a high osmolal gap. It is not the treatment for acetaminophen overdose.`},
k:`Start N-acetylcysteine for an acute acetaminophen ingestion when the level drawn ≥4 hours after ingestion is on or above the Rumack-Matthew treatment line; it is most effective within 8 hours.`},

{s:'Multisystem',
q:`A 28-year-old woman is brought to the emergency department 20 minutes after developing hives, lip swelling, and trouble breathing while eating at a seafood restaurant. She has seasonal allergies but no known food allergies and takes no medications. Blood pressure is 78/42 mm Hg, pulse is 132/min, respirations are 28/min, and oxygen saturation is 89% on room air. She is anxious and her voice is hoarse. There are raised, itchy, red welts over her trunk and arms, her lips and tongue are swollen, and there is wheezing throughout both lungs. Oxygen is applied, and an intravenous line is placed.`,
ask:`Which of the following is the most appropriate initial treatment?`,
o:['Intramuscular epinephrine 0.5 mg (1 mg/mL) in the outer thigh','Intravenous diphenhydramine','Intravenous methylprednisolone','Nebulized albuterol','Intravenous epinephrine 1 mg (0.1 mg/mL) push'],a:0,
e:[`This patient has anaphylaxis: sudden skin and mucosal involvement (hives, swelling) with breathing difficulty and low blood pressure after exposure to a likely allergen (shellfish). Anaphylaxis results from IgE-triggered release of histamine and other mediators from mast cells, causing blood vessels to dilate and leak, airways to narrow, and airway tissues to swell.`,
`Intramuscular epinephrine is the first-line treatment and should be given immediately. It constricts blood vessels and reduces swelling (alpha-1), increases cardiac output (beta-1), and opens the airways and stabilizes mast cells (beta-2). The dose is 0.01 mg/kg of the 1 mg/mL solution, up to 0.5 mg in adults, injected into the outer thigh and repeated every 5–15 minutes as needed. She should lie flat with legs raised and receive large volumes of intravenous fluid. Persistent low blood pressure after repeated IM doses may require a carefully adjusted epinephrine infusion.`],
w:{B:`Antihistamines such as diphenhydramine relieve itching and hives but do not reverse airway obstruction or shock. They are add-ons given after epinephrine.`,
C:`Steroids take hours to work and do not treat the immediate effects of anaphylaxis. Their role in preventing a second-wave reaction is unproven.`,
D:`Inhaled albuterol can help persistent wheezing after epinephrine but does not treat throat swelling or shock.`,
E:`A 1-mg IV push of 0.1 mg/mL epinephrine is the cardiac arrest dose. Giving it to a patient with a pulse can cause dangerous hypertension, ventricular arrhythmias, and myocardial ischemia.`},
k:`Treat anaphylaxis first with intramuscular epinephrine (0.01 mg/kg of 1 mg/mL, maximum 0.5 mg) in the outer thigh; antihistamines, steroids, and bronchodilators are add-ons only.`},

{s:'Neurology',
q:`A 45-year-old man is brought to the emergency department 2 hours after a severe headache at the back of his head began abruptly while he was lifting weights at the gym. He says the pain reached full intensity within seconds and is the worst he has ever had. He vomited twice on the way to the hospital. He has hypertension and smokes 1 pack of cigarettes a day. He does not usually get headaches. Blood pressure is 172/98 mm Hg, pulse is 88/min, and temperature is 37.1 C (98.8 F). He is alert and oriented but uncomfortable. Bending his neck forward is painful. Pupils are equal and reactive, eye movements are full, and there is no papilledema. Strength, sensation, and reflexes are normal and symmetric.`,
ask:`Which of the following is the most appropriate initial diagnostic study?`,
o:['Cerebral digital subtraction angiography','Lumbar puncture','MRI of the brain with gadolinium','Noncontrast CT of the head','Transcranial Doppler ultrasonography'],a:3,
e:[`A sudden, severe headache that peaks within seconds to a minute (thunderclap headache), especially during exertion and with vomiting and neck stiffness, is highly concerning for subarachnoid hemorrhage (SAH). Most SAH not caused by trauma results from a ruptured saccular aneurysm. Risk factors include hypertension, smoking, heavy alcohol use, family history, polycystic kidney disease, and Ehlers-Danlos syndrome.`,
`Noncontrast head CT is the first test; it detects nearly all SAH when done within 6 hours of headache onset, and its sensitivity falls after that. If CT is negative and was done more than 6 hours after onset, lumbar puncture should look for red blood cells that do not clear and for xanthochromia (yellow fluid from broken-down blood). Once SAH is confirmed, CT angiography or catheter angiography finds the aneurysm for coiling or clipping, and nimodipine is started to reduce delayed brain injury from vasospasm.`],
w:{A:`Catheter angiography is the gold standard for characterizing the aneurysm once SAH is confirmed and is often combined with coiling. It is invasive and is not the first test.`,
B:`Lumbar puncture is done when CT is negative but suspicion remains, especially when CT was done more than 6 hours after onset. It should not come before imaging, which finds blood quickly and rules out a mass that could make lumbar puncture dangerous.`,
C:`MRI is less available, takes longer, and is less practical in a possibly unstable patient. Gadolinium does not improve detection of fresh blood.`,
E:`Transcranial Doppler detects faster blood flow from vasospasm and is used to monitor patients 3–14 days after SAH. It does not diagnose the bleed itself.`},
k:`Thunderclap headache suggests subarachnoid hemorrhage; obtain noncontrast head CT first, and perform lumbar puncture if CT is negative and was done more than 6 hours after onset.`},

{s:'Neurology',
q:`A 34-year-old man comes to the emergency department because of 4 days of tingling in his feet and hands and worsening leg weakness. This morning, he could not climb the stairs to his apartment. Two weeks ago, he had 3 days of diarrhea after a family barbecue. He has no trouble with bladder or bowel control and no double vision or trouble swallowing. Blood pressure has ranged from 112/70 to 164/96 mm Hg over the past 2 hours, and pulse is 112/min. Strength is 3/5 in the hip flexors, 4/5 in ankle dorsiflexion, and 4/5 in the shoulders. Knee and ankle reflexes are absent, and biceps reflexes are reduced. Vibration sense is mildly reduced at the toes. There is no level on the trunk below which sensation is lost. Cranial nerves are normal, and there is no eyelid drooping or weakness that worsens with repeated effort. Forced vital capacity is 2.6 L (55% of predicted). Lumbar puncture shows protein 92 mg/dL, 2 white cells/µL, and normal glucose. MRI of the spine is normal.`,
ask:`Which of the following is the most appropriate treatment?`,
o:['Intravenous immune globulin','Intravenous methylprednisolone','Oral pyridostigmine','Botulinum antitoxin','Plasma exchange followed immediately by intravenous immune globulin'],a:0,
e:[`This patient has Guillain-Barré syndrome (GBS), most often acute inflammatory demyelinating polyneuropathy. It typically follows a respiratory or gastrointestinal infection (Campylobacter jejuni is the classic trigger) by 1–4 weeks, when antibodies against the infection cross-react with peripheral nerves. Features include rapidly progressive, symmetric weakness that usually starts in the legs, loss of reflexes, mild sensory symptoms, and autonomic instability (fluctuating blood pressure, rapid heart rate). Cerebrospinal fluid shows high protein with a normal cell count, and spine imaging rules out cord compression.`,
`Patients who cannot walk unaided or are getting worse should be treated with intravenous immune globulin (IVIG) or plasma exchange, which are equally effective when started within 2–4 weeks of onset. Because respiratory failure can develop quickly, patients are admitted to a monitored setting with serial measurements of forced vital capacity and inspiratory pressure. Intubation is considered when vital capacity falls below about 20 mL/kg or drops rapidly. This patient's falling vital capacity and unstable blood pressure warrant intensive care monitoring.`],
w:{B:`Corticosteroids do not help in GBS and may slow recovery. They are effective in chronic inflammatory demyelinating polyneuropathy, which progresses for more than 8 weeks.`,
C:`Pyridostigmine treats myasthenia gravis, which causes weakness that worsens with use, drooping eyelids, double vision, and normal reflexes, sensation, and spinal fluid.`,
D:`Botulism causes descending paralysis that starts with the cranial nerves (double vision, slurred speech, trouble swallowing), often with dilated pupils, normal sensation, and normal spinal fluid. This patient's weakness is ascending with tingling and loss of reflexes.`,
E:`Giving plasma exchange and then IVIG provides no more benefit than either one alone and adds risk and cost. One therapy is chosen.`},
k:`Guillain-Barré syndrome causes ascending symmetric weakness with lost reflexes and high spinal fluid protein with normal cells; treat with IVIG or plasma exchange (not steroids) and monitor vital capacity closely.`},

{s:'Obstetrics',
q:`A 26-year-old woman, gravida 1 para 0, at 34 weeks' gestation is brought to the emergency department after a 2-minute generalized tonic-clonic seizure at home. For the past day, she has had a severe frontal headache and seen flashing lights. She has missed her prenatal visits for the past 6 weeks. She has no history of seizures. On arrival, she is drowsy but arousable. Blood pressure is 168/112 mm Hg on 2 readings 15 minutes apart, and pulse is 96/min. There is 2+ pitting edema of both legs, and reflexes are 3+ with 3 beats of clonus at the ankles. Fetal heart rate tracing shows a baseline of 150/min with moderate variability. Laboratory results are as follows:`,
lab:[['Hemoglobin','12.4 g/dL'],['Platelets','128,000/mm3'],['AST','58 U/L'],['ALT','61 U/L'],['Creatinine','0.9 mg/dL'],['Urine protein/creatinine ratio','2.1 (reference: <0.3)']],
ask:`Which of the following is the most appropriate medication to prevent recurrent seizures?`,
o:['Diazepam','Labetalol','Levetiracetam','Magnesium sulfate','Phenytoin'],a:3,
e:[`This patient has eclampsia: new generalized seizures in a patient with preeclampsia (high blood pressure after 20 weeks' gestation with proteinuria or organ involvement). Warning symptoms include severe headache, visual disturbances, and brisk reflexes. Magnesium sulfate is the drug of choice to treat eclamptic seizures and prevent recurrence; it outperformed phenytoin and benzodiazepines in randomized trials. A typical regimen is a 4- to 6-g intravenous loading dose, then 1–2 g/hr, continued for 24 hours after delivery.`,
`Magnesium is cleared by the kidneys, so patients are monitored for toxicity: loss of reflexes appears first, followed by breathing depression and cardiac arrest at higher levels. Toxicity is treated by stopping the infusion and giving intravenous calcium gluconate. After the mother is stabilized (seizures and blood pressure controlled), delivery is the definitive treatment and is indicated for eclampsia at any gestational age.`],
w:{A:`Benzodiazepines may be used for a seizure that continues despite magnesium, but they are less effective at preventing recurrence and cause breathing depression in mother and baby.`,
B:`Labetalol (or IV hydralazine or oral nifedipine) is needed to lower severe-range blood pressure (≥160/110 mm Hg) and prevent stroke. It is required in this patient but does not prevent eclamptic seizures.`,
C:`Levetiracetam is used for epilepsy, including in pregnancy, but is not first-line for eclampsia because magnesium has proven superior.`,
E:`Phenytoin was used for eclampsia in the past but is less effective than magnesium sulfate at preventing recurrent seizures.`},
k:`Magnesium sulfate is first-line to treat and prevent eclamptic seizures; monitor reflexes, breathing, and urine output, treat toxicity with calcium gluconate, and deliver after stabilization.`},

{s:'Obstetrics',
q:`A 32-year-old woman, gravida 3 para 2, at 33 weeks' gestation comes to the labor and delivery unit because of vaginal bleeding that began 1 hour ago after intercourse. She has soaked 1 pad with bright red blood. She has had no abdominal pain, contractions, or leakage of fluid. Both of her children were delivered by cesarean. She missed her 20-week ultrasound appointment. She does not smoke or use drugs. Blood pressure is 118/72 mm Hg, and pulse is 92/min. The abdomen is soft, and the uterus is nontender without palpable contractions. Gentle speculum examination shows a small amount of bright red blood at the cervical opening. Fetal heart rate tracing shows a baseline of 145/min with moderate variability and accelerations. Hemoglobin is 11.2 g/dL, and coagulation studies are normal.`,
ask:`Which of the following is the most likely cause of this patient's bleeding?`,
o:['Placenta previa','Placental abruption','Uterine rupture','Vasa previa','Cervical ectropion'],a:0,
e:[`Painless vaginal bleeding in the second half of pregnancy, often after intercourse, with a soft, nontender uterus and a reassuring fetal heart tracing is characteristic of placenta previa, in which the placenta covers the internal opening of the cervix. Risk factors include prior cesarean delivery or uterine surgery, multiple prior births, older maternal age, twins, and smoking. Because she has previa and 2 prior cesareans, she is also at high risk for placenta accreta spectrum (abnormally invasive placenta).`,
`Digital cervical examination must be avoided until previa has been ruled out by ultrasound, because it can trigger massive bleeding. Transvaginal ultrasound is safe and more accurate than abdominal ultrasound. A stable patient with a preterm fetus is managed in the hospital with blood typing, antenatal corticosteroids (between 24 and 34 weeks), and anti-D immune globulin if she is Rh negative. Planned cesarean delivery is done at 36–37 weeks, or sooner for heavy bleeding or fetal distress.`],
w:{B:`Placental abruption is early separation of the placenta, typically causing painful bleeding, a tender, firm uterus, frequent small contractions, and possible fetal distress. Risk factors include hypertension, cocaine use, smoking, and trauma.`,
C:`Uterine rupture usually occurs during labor in women with a prior uterine scar and causes sudden severe abdominal pain, loss of the baby's station, and fetal heart rate abnormalities.`,
D:`In vasa previa, unprotected fetal vessels cross the cervical opening. Bleeding begins when the membranes rupture and is fetal blood, so the fetal heart rate quickly becomes abnormal while the mother stays stable.`,
E:`Cervical ectropion can cause light spotting after intercourse in pregnancy. It is a diagnosis of exclusion that is considered only after previa has been ruled out by ultrasound, especially with bleeding heavy enough to soak a pad.`},
k:`Painless third-trimester bleeding with a nontender uterus and a reassuring fetal tracing suggests placenta previa; avoid digital cervical examination until transvaginal ultrasound shows where the placenta is.`},

{s:'Oncology',
q:`A 62-year-old man with cirrhosis from chronic hepatitis C, which was cured with antiviral therapy 3 years ago, comes for follow-up after routine surveillance ultrasound showed a new 3.1-cm liver lesion. He has no abdominal pain or weight loss. Examination shows red palms and spider-like blood vessels on the chest; there is no ascites or jaundice. Multiphase contrast CT of the abdomen shows a 3.1-cm lesion that enhances brightly in the arterial phase and appears darker than the surrounding liver in the portal venous and delayed phases, with an enhancing rim. There is no vascular invasion or spread outside the liver. Bilirubin and albumin are normal, and the platelet count is 142,000/mm3. The lesion is surgically removed, and pathology confirms the diagnosis.`,
ask:`Which of the following serum markers is most useful for monitoring this patient for recurrence?`,
o:['Alpha-fetoprotein','CA 19-9','CA-125','Carcinoembryonic antigen','Chromogranin A'],a:0,
e:[`Hepatocellular carcinoma (HCC) develops most often in patients with cirrhosis from any cause and in patients with chronic hepatitis B even without cirrhosis. Patients with cirrhosis need surveillance ultrasound, with or without alpha-fetoprotein (AFP), every 6 months. HCC is supplied mainly by the hepatic artery, so on multiphase CT or MRI it enhances brightly in the arterial phase and then "washes out" in later phases. In a patient with cirrhosis, a lesion of 1 cm or more with this pattern is diagnostic, and biopsy is not needed.`,
`AFP is elevated in about 60%–70% of patients with HCC. When it is elevated before treatment, it is useful for monitoring response and detecting recurrence after surgery, ablation, or transplant, along with periodic imaging. Even after hepatitis C is cured, patients with cirrhosis remain at risk for HCC and need continued surveillance.`],
w:{B:`CA 19-9 is used to monitor pancreatic cancer and cholangiocarcinoma. Cholangiocarcinoma in the liver typically enhances gradually from the edges rather than brightly in the arterial phase with washout.`,
C:`CA-125 is used to monitor ovarian cancer. It can also rise nonspecifically with ascites, peritoneal inflammation, and endometriosis.`,
D:`Carcinoembryonic antigen is used to monitor colorectal cancer after surgery. Colorectal metastases to the liver usually appear darker than the liver and occur in a liver without cirrhosis.`,
E:`Chromogranin A is a marker for neuroendocrine tumors (eg, carcinoid). Their liver metastases can enhance brightly, but in a cirrhotic liver this pattern is diagnostic of HCC.`},
k:`In cirrhosis, a liver lesion ≥1 cm with arterial enhancement and washout is diagnostic of hepatocellular carcinoma without biopsy; alpha-fetoprotein is the tumor marker used to monitor HCC.`},

{s:'Ophthalmology',
q:`A 63-year-old woman is brought to the emergency department 2 hours after severe pain began in her left eye while she was watching a movie in a dark theater. She also has a headache over her forehead, nausea, and vomiting and sees colored rings around lights. She is farsighted and wears reading glasses. Earlier in the day, she took an over-the-counter cold medicine containing diphenhydramine. Visual acuity is 20/200 in the left eye and 20/30 in the right. The left eye is red, most intensely around the cornea. The cornea is hazy, and the pupil is mid-sized (5 mm) and does not react to light. The left eye feels firm when pressed gently through the closed eyelid. Intraocular pressure is 58 mm Hg in the left eye (reference: 10–21 mm Hg) and 18 mm Hg in the right.`,
ask:`Which of the following is the most appropriate initial treatment?`,
o:['Topical atropine','Topical timolol, apraclonidine, and pilocarpine with intravenous acetazolamide','Topical prednisolone acetate','Topical moxifloxacin','Outpatient referral for visual field testing'],a:1,
e:[`This patient has acute angle-closure glaucoma. In susceptible eyes (farsightedness, older age, female sex, East Asian descent), dilation of the pupil, from dim light or from anticholinergic or sympathomimetic drugs such as diphenhydramine, pushes the outer edge of the iris against the drainage angle and blocks fluid outflow. Eye pressure rises rapidly, causing severe eye pain, headache, nausea and vomiting, blurred vision with halos (from corneal swelling), a fixed mid-sized pupil, and a firm eye.`,
`This is an emergency; permanent optic nerve damage can occur within hours. Pressure is lowered immediately with several drugs: topical timolol (a beta blocker) and apraclonidine (an alpha-2 agonist) reduce fluid production, intravenous or oral acetazolamide also reduces production, and pilocarpine constricts the pupil to pull the iris away from the angle once pressure starts to fall. Mannitol may be added if needed. Definitive treatment is laser peripheral iridotomy, which is also done in the other eye to prevent an attack.`],
w:{A:`Atropine dilates the pupil and relaxes the ciliary muscle; it is used for anterior uveitis. Dilating the pupil worsens angle closure and is contraindicated.`,
C:`Topical steroids treat anterior uveitis, which causes pain, light sensitivity, redness around the cornea, and a small, sometimes irregular pupil. Uveitis does not usually cause very high pressure with a fixed mid-sized pupil.`,
D:`Topical fluoroquinolones treat bacterial keratitis (eg, in contact lens wearers), which causes pain, light sensitivity, and a white spot or ulcer on the cornea. Antibiotics do not lower eye pressure.`,
E:`Visual field testing is used to follow chronic open-angle glaucoma, which causes painless, gradual loss of side vision. Delaying treatment of acute angle closure risks permanent vision loss.`},
k:`Acute angle-closure glaucoma causes a painful red eye, halos, a fixed mid-sized pupil, and very high eye pressure; lower pressure immediately with timolol, apraclonidine, pilocarpine, and acetazolamide, then perform laser iridotomy, and avoid pupil-dilating drugs.`},

{s:'Pediatrics',
q:`A 2-year-old boy is brought to the emergency department at 2 AM because of noisy breathing and a harsh cough that sounds like a seal barking. He had a runny nose and low-grade fever for 2 days before the cough began this evening. He is fully immunized and has never wheezed. Temperature is 38.1 C (100.6 F), pulse is 136/min, respirations are 36/min, and oxygen saturation is 96% on room air. He is sitting on his mother's lap, alert and interactive, and drinking from a cup. He is not drooling. A high-pitched sound is heard when he breathes in, even while calm, and there is mild pulling-in of the skin above the breastbone and between the ribs. Air entry is good on both sides, and there is no wheezing. The throat is mildly red without exudate.`,
ask:`Which of the following is the most appropriate management?`,
o:['Oral dexamethasone and nebulized racemic epinephrine','Oral dexamethasone alone, then discharge home','Intravenous ceftriaxone and vancomycin','Nebulized albuterol','Lateral neck x-ray before any treatment'],a:0,
e:[`This child has croup (laryngotracheobronchitis), most often caused by parainfluenza virus. It usually affects children aged 6 months to 3 years and begins with cold symptoms followed by a barking cough, hoarseness, and inspiratory stridor that is often worse at night. Swelling narrows the airway just below the vocal cords. The diagnosis is clinical, and imaging is not usually needed.`,
`Treatment depends on severity. All children with croup, even mild cases, benefit from a single dose of dexamethasone, which reduces airway swelling within hours. Stridor at rest with retractions means moderate to severe croup, so nebulized racemic epinephrine is added; it quickly shrinks the swollen airway lining. Its effect lasts about 2 hours, so the child should be watched for at least 2–4 hours afterward for return of symptoms before discharge.`],
w:{B:`Dexamethasone alone is appropriate for mild croup (barking cough without stridor at rest or retractions). This child has stridor at rest and retractions and needs epinephrine and observation.`,
C:`Bacterial tracheitis (usually Staphylococcus aureus) can follow viral croup and causes high fever, a toxic appearance, and stridor that does not improve with epinephrine; it needs IV antibiotics and often intubation. This child looks well with a low-grade fever.`,
D:`Albuterol treats narrowing of the lower airways (eg, asthma). It does not relieve swelling below the vocal cords, and this child is not wheezing.`,
E:`X-rays may show narrowing below the vocal cords but are not needed for diagnosis and should never delay treatment. They are reserved for unusual cases, suspected foreign body, or poor response.`},
k:`Croup is a clinical diagnosis; give dexamethasone to every patient, add nebulized racemic epinephrine for stridor at rest, and observe for 2–4 hours afterward.`},

{s:'Pediatrics',
q:`A 9-month-old boy is brought to the emergency department because of episodes of inconsolable crying for the past 10 hours. Each episode lasts several minutes and recurs every 15–20 minutes; during them he pulls his legs up to his belly, and between them he is unusually sleepy. He has vomited 4 times, first stomach contents and most recently greenish fluid. An hour ago, he passed a dark red stool mixed with mucus. He had a cold last week. Temperature is 37.6 C (99.7 F), pulse is 158/min, and blood pressure is 88/54 mm Hg. He is drowsy between crying spells. The abdomen is soft, with a tender, elongated mass in the right upper area; the lower right abdomen feels empty. There is no rebound or guarding. Abdominal ultrasound shows a 3.5-cm mass in the right upper abdomen made of alternating bright and dark rings. Abdominal x-ray shows no free air.`,
ask:`After intravenous fluid resuscitation, which of the following is the most appropriate next step in management?`,
o:['Air or contrast enema','Exploratory laparotomy','Technetium-99m pertechnetate scan','Upper gastrointestinal contrast study','Stool culture and oral rehydration'],a:0,
e:[`Intussusception, the telescoping of one segment of bowel into the next (usually where the small bowel meets the colon), is the most common cause of intestinal obstruction in children aged 6–36 months. Most cases have no identifiable cause and are thought to start at swollen lymphoid tissue in the bowel wall after a viral infection. The classic picture is episodes of colicky pain with legs drawn up, vomiting, and sleepiness between episodes, followed by bloody, mucus-filled stool as the bowel wall becomes congested and ischemic. A sausage-shaped mass may be felt, with emptiness of the lower right abdomen.`,
`Ultrasound is the diagnostic test of choice and shows concentric rings of bowel wall (target sign). In a stable child without peritonitis or perforation, the treatment of choice is reduction with an air or liquid contrast enema under imaging guidance, which both confirms and treats the problem and succeeds in about 80%–90% of cases. It recurs in about 10% of children, usually within 24 hours.`],
w:{B:`Surgery is indicated for peritonitis, perforation (free air), instability despite resuscitation, a failed enema, or a structural lead point. This child has none of these.`,
C:`A technetium-99m pertechnetate scan detects stomach tissue in a Meckel diverticulum, which typically causes painless rectal bleeding in a toddler. A Meckel diverticulum can be a lead point for intussusception, but the scan is not the next step.`,
D:`An upper GI study diagnoses malrotation with volvulus, which causes sudden green vomiting, usually in the first month of life. The ultrasound here confirms intussusception.`,
E:`Infectious gastroenteritis can cause vomiting and bloody diarrhea, but it does not cause episodes of severe pain with sleepiness in between, a palpable mass, or this ultrasound finding.`},
k:`Intussusception causes episodic colicky pain, vomiting, sleepiness, and bloody mucus-filled stool in children aged 6–36 months; ultrasound shows a target sign, and stable children are treated with air or contrast enema reduction.`},

{s:'Primary Care',
q:`A 48-year-old man comes to the office for a routine health maintenance visit. He feels well and has no cough, coughing up blood, shortness of breath, or weight loss. He has smoked 1.5 packs of cigarettes daily since age 18 (45 pack-years) and is not ready to quit, although he would consider it in the future. He has hypertension treated with amlodipine. His father had a myocardial infarction at age 70. Blood pressure is 132/82 mm Hg, and body mass index is 28 kg/m2. Examination, including lung examination, is normal. He asks about lung cancer screening because a coworker of the same age recently had a low-dose CT.`,
ask:`In addition to smoking cessation counseling, which of the following is the most appropriate recommendation regarding lung cancer screening?`,
o:['Annual low-dose CT of the chest starting now','Annual chest x-ray starting now','Annual low-dose CT of the chest starting at age 50','Annual sputum cytology starting now','A single low-dose CT of the chest now, repeated only if abnormal'],a:2,
e:[`The US Preventive Services Task Force recommends annual lung cancer screening with low-dose CT (LDCT) for adults aged 50–80 years who have a smoking history of at least 20 pack-years and who currently smoke or quit within the past 15 years. This patient has a heavy smoking history, but at 48 he is not yet in the eligible age range. He should begin annual LDCT at age 50 if he still meets the smoking criteria. Screening younger adults has not been shown to be beneficial, because cancer rates are lower and the harms of screening (false positives, procedures, radiation) are relatively larger.`,
`Smoking cessation is the single most effective way to lower his lung cancer risk and should be addressed at every visit. Before screening begins, shared decision-making should cover benefits, the high rate of false-positive results, incidental findings, overdiagnosis, and radiation exposure. Screening continues yearly until he has not smoked for 15 years or develops a condition that limits life expectancy or his ability or willingness to have curative surgery.`],
w:{A:`Annual LDCT is the correct test, but screening starts at age 50. Starting at 48 is outside the recommended age range.`,
B:`Chest x-ray screening, with or without sputum testing, has not been shown to reduce lung cancer deaths and is not recommended at any age.`,
D:`Sputum cytology misses many cancers, especially peripheral adenocarcinomas, and does not reduce deaths.`,
E:`The benefit seen in trials came from repeated annual scans. A single scan misses cancers that develop later, and screening should not begin before age 50 in any case.`},
k:`Annual low-dose CT lung cancer screening begins at age 50 for people with ≥20 pack-years who smoke now or quit within 15 years; younger patients should receive cessation counseling and start screening when eligible.`},

{s:'Psychiatry',
q:`A 32-year-old woman comes to the office because of low mood for the past 2 months. She has lost interest in running and painting, which she used to enjoy, wakes at 4 AM and cannot fall back asleep, has trouble concentrating at work, and has lost 4 kg without trying. She feels guilty about being a burden to her partner. She has occasional thoughts that she would be better off not waking up but has no intent or plan to harm herself. She has never had a period of reduced need for sleep, unusually high mood, or impulsive spending. She does not use alcohol or drugs. She has no medical conditions and takes no medications. Vital signs are normal. Her affect is flat and her speech is slow; her thinking is logical. Her PHQ-9 score is 19. Complete blood count, metabolic panel, and TSH are normal. Urine hCG is negative.`,
ask:`Which of the following is the most appropriate medication?`,
o:['Alprazolam','Amitriptyline','Lithium','Sertraline','Phenelzine'],a:3,
e:[`This patient meets criteria for major depressive disorder: at least 5 symptoms for at least 2 weeks, including depressed mood or loss of interest, causing significant impairment. Her symptoms include low mood, loss of interest, early morning waking, weight loss, poor concentration, excessive guilt, and passive thoughts of death. Medical causes have been ruled out, and she has no history of mania or hypomania, so bipolar disorder is unlikely. Passive suicidal thoughts require a safety assessment and plan, but without intent or a plan she can be treated as an outpatient.`,
`Selective serotonin reuptake inhibitors (SSRIs) such as sertraline, escitalopram, and fluoxetine are first-line because they are effective, well tolerated, and relatively safe in overdose. Other first-line choices include SNRIs, bupropion, and mirtazapine, and combining medication with psychotherapy works better than either alone for moderate to severe depression. Response takes 4–6 weeks, and treatment continues for 6–12 months after remission. Young adults should be watched for increased suicidal thinking early in treatment.`],
w:{A:`Benzodiazepines such as alprazolam can briefly ease anxiety or insomnia but do not treat depression, and they carry risks of dependence and dangerous breathing depression in overdose.`,
B:`Tricyclic antidepressants such as amitriptyline work but cause anticholinergic and sedating side effects and are very dangerous in overdose (heart rhythm problems, seizures). They are not first-line, especially for patients with suicidal thoughts.`,
C:`Lithium is first-line for bipolar disorder and can be added for treatment-resistant depression. It has a narrow safety margin and is dangerous in overdose; it is not a first medication for unipolar depression.`,
E:`MAO inhibitors such as phenelzine are reserved for treatment-resistant or atypical depression because of dietary restrictions (high-tyramine foods can cause a hypertensive crisis) and dangerous drug interactions (eg, serotonin syndrome).`},
k:`SSRIs are first-line medications for major depressive disorder because they are effective, well tolerated, and safer in overdose; avoid tricyclics in patients with suicidal thoughts, and screen for past mania before starting an antidepressant.`},

{s:'Pulmonary',
q:`A 62-year-old man is brought to the emergency department because of 3 days of fever, dry cough, and shortness of breath. He has also had watery diarrhea 4–5 times a day and a headache, and his wife says he has seemed confused since this morning. He returned 5 days ago from a 4-day conference out of state. He has smoked 30 pack-years and drinks 3–4 alcoholic drinks daily. Temperature is 39.8 C (103.6 F), blood pressure is 118/70 mm Hg, pulse is 88/min, respirations are 26/min, and oxygen saturation is 89% on room air. Crackles are heard at both lung bases. Chest x-ray shows patchy infiltrates in both lower lobes. Laboratory results are as follows:`,
lab:[['Leukocytes','14,200/mm3'],['Sodium','128 mEq/L'],['Phosphorus','2.0 mg/dL'],['AST','92 U/L'],['ALT','80 U/L'],['Creatinine','1.3 mg/dL'],['Sputum Gram stain','Many neutrophils; no organisms seen']],
ask:`Which of the following is the most likely cause of this patient's pneumonia?`,
o:['Chlamydophila pneumoniae','Klebsiella pneumoniae','Legionella pneumophila','Mycoplasma pneumoniae','Streptococcus pneumoniae'],a:2,
e:[`Legionella pneumophila is a gram-negative bacterium that lives in water systems (eg, hotel and building plumbing, cooling towers, hot tubs) and is inhaled in aerosolized water; recent travel and overnight stays are common exposures. Risk factors for severe disease include smoking, heavy alcohol use, older age, and immunosuppression. Legionella causes a severe pneumonia with high fever and prominent symptoms outside the lungs, including diarrhea, headache, and confusion. Characteristic laboratory findings are hyponatremia, low phosphorus, and elevated liver enzymes. Sputum shows many neutrophils but few or no organisms, because Legionella stains poorly with Gram stain.`,
`The diagnosis is confirmed with a urine Legionella antigen test (which detects serogroup 1, the most common cause) and with sputum culture on special media or PCR, which can detect other serogroups. Treatment is a respiratory fluoroquinolone (eg, levofloxacin) or azithromycin. Hospitalized patients with community-acquired pneumonia routinely receive a regimen that covers Legionella (eg, ceftriaxone plus azithromycin).`],
w:{A:`Chlamydophila pneumoniae causes a mild, gradual pneumonia, often with sore throat and hoarseness. It does not usually cause high fever, confusion, diarrhea, or marked lab abnormalities.`,
B:`Klebsiella pneumoniae causes severe pneumonia in people with heavy alcohol use or diabetes, typically with thick, bloody sputum, upper lobe consolidation, and abscesses. Gram stain shows plump gram-negative rods, unlike the absence of organisms here.`,
D:`Mycoplasma pneumoniae causes a usually mild "walking" pneumonia in young adults, sometimes with ear findings, rash, or cold agglutinin hemolysis. Severe illness with confusion, diarrhea, and hyponatremia in an older smoker is more typical of Legionella.`,
E:`Streptococcus pneumoniae is the most common cause of community-acquired pneumonia and can cause severe illness. However, it typically produces a productive cough with lobar consolidation, and a good sputum sample shows gram-positive diplococci. Multisystem symptoms with hyponatremia and no organisms on Gram stain favor Legionella.`},
k:`Suspect Legionella in severe pneumonia with diarrhea, confusion, hyponatremia, low phosphorus, elevated liver enzymes, and many neutrophils without organisms on Gram stain; confirm with the urine antigen test and treat with a fluoroquinolone or azithromycin.`},

{s:'Renal',
q:`A 68-year-old man is brought to the office by his wife because of 1 week of fatigue, poor appetite, and mild forgetfulness. He has a 50-pack-year smoking history and a chronic cough that has worsened over 2 months, with a 5-kg weight loss. He takes no medications, including diuretics, and drinks 1–2 beers per week. Blood pressure is 132/80 mm Hg without change on standing, and pulse is 78/min. His mouth is moist, neck veins are normal, and there is no leg swelling. He is oriented but slow to answer questions. There is no flapping tremor or focal neurologic deficit. Laboratory results are as follows:`,
lab:[['Sodium','124 mEq/L'],['Potassium','4.1 mEq/L'],['Bicarbonate','25 mEq/L'],['Blood urea nitrogen','8 mg/dL'],['Creatinine','0.7 mg/dL'],['Glucose','96 mg/dL'],['Uric acid','2.6 mg/dL'],['Serum osmolality','256 mOsm/kg'],['Urine osmolality','520 mOsm/kg'],['Urine sodium','48 mEq/L'],['TSH','1.8 µU/mL'],['Morning cortisol','18 µg/dL']],
ask:`Which of the following is the most likely cause of this patient's hyponatremia?`,
o:['Beer potomania','Cerebral salt wasting','Diuretic-induced hypovolemic hyponatremia','Primary adrenal insufficiency','Syndrome of inappropriate antidiuretic hormone secretion'],a:4,
e:[`This patient has hyponatremia with low serum osmolality, normal volume status, inappropriately concentrated urine (urine osmolality >100 mOsm/kg), and urine sodium >30 mEq/L, with normal thyroid and adrenal function. This meets criteria for the syndrome of inappropriate antidiuretic hormone secretion (SIADH). Low BUN and low uric acid support the diagnosis. Excess ADH makes the kidneys hold on to water; the slight volume expansion that results increases sodium excretion, so patients do not develop edema. In a heavy smoker with a worsening cough and weight loss, small cell lung cancer, which can secrete ADH, is a major concern, and chest imaging is needed.`,
`Mild to moderately symptomatic chronic SIADH is treated with fluid restriction (eg, <800 mL/day) and treatment of the cause; salt tablets with a loop diuretic, or vaptans, may be added. Severe symptoms (seizures, unresponsiveness) require hypertonic (3%) saline. Sodium should be raised by no more than 8 mEq/L in 24 hours to avoid osmotic demyelination syndrome.`],
w:{A:`Beer potomania results from very low solute intake with large volumes of beer, so the kidneys cannot excrete enough water. Urine is maximally dilute (osmolality <100 mOsm/kg) and urine sodium is low. This patient drinks little and has concentrated urine.`,
B:`Cerebral salt wasting follows brain injury (eg, subarachnoid hemorrhage, neurosurgery) and causes sodium loss with true volume depletion (dizziness on standing, high BUN). This patient has no brain injury and normal volume status.`,
C:`Thiazide diuretics commonly cause hyponatremia, often with low potassium and volume depletion. This patient takes no medications and is not volume depleted.`,
D:`Primary adrenal insufficiency causes hyponatremia with high potassium, low blood pressure, and darkened skin. This patient's potassium and morning cortisol are normal.`},
k:`SIADH causes hyponatremia with normal volume status, inappropriately concentrated urine (>100 mOsm/kg), and urine sodium >30 mEq/L after excluding thyroid and adrenal causes; in a smoker, look for small cell lung cancer and raise sodium by ≤8 mEq/L per 24 hours.`},

{s:'Surgery',
q:`A 31-year-old man is brought to the emergency department 30 minutes after his motorcycle hit a guardrail at high speed. He was wearing a helmet. He reports abdominal pain and pain at the tip of his left shoulder. Blood pressure is 78/44 mm Hg, pulse is 136/min, and respirations are 26/min. Oxygen saturation is 96% on 4 L of oxygen. His airway is clear, and breath sounds are equal on both sides. He is pale and sweaty, and his Glasgow Coma Scale score is 14. There are abrasions over the left lower chest and left upper abdomen. The abdomen is distended and tender throughout, with guarding. The pelvis is stable. He receives 1 L of crystalloid and 2 units of uncrossmatched O-negative red blood cells, after which blood pressure is 82/50 mm Hg and pulse is 130/min. Bedside ultrasound (FAST) shows free fluid between the liver and right kidney and around the spleen. Chest and pelvic x-rays show no blood or air in the chest and no pelvic fracture.`,
ask:`Which of the following is the most appropriate next step in management?`,
o:['CT of the abdomen and pelvis with intravenous contrast','Diagnostic peritoneal lavage','Exploratory laparotomy','Repeat FAST examination in 30 minutes','Angiographic embolization of the spleen'],a:2,
e:[`This patient has blunt abdominal trauma with hemorrhagic shock that does not respond to initial resuscitation (persistent hypotension and tachycardia after crystalloid and blood). Abrasions over the left upper abdomen, left shoulder pain from blood irritating the diaphragm, and free fluid on FAST indicate ongoing intra-abdominal bleeding, most likely from the spleen. Chest and pelvic x-rays have ruled out other major sources of blood loss.`,
`Unstable patients with a positive FAST need emergency exploratory laparotomy to control bleeding. Resuscitation continues with a balanced massive transfusion (plasma, platelets, and red cells in roughly equal ratios) and tranexamic acid within 3 hours of injury, while limiting crystalloid. CT is reserved for stable patients, because moving an unstable patient to the scanner delays control of the bleeding.`],
w:{A:`CT with contrast is the preferred study for stable patients with blunt abdominal trauma because it grades organ injuries and guides nonoperative care. It is unsafe in unstable patients.`,
B:`Diagnostic peritoneal lavage was once used to detect intra-abdominal bleeding. FAST has largely replaced it, and this patient's FAST is already positive, so more testing only delays surgery.`,
D:`Repeat FAST is useful when the first exam is negative or unclear and the patient's condition changes. A positive FAST in an unstable patient is an indication for immediate surgery.`,
E:`Angiographic embolization is an option for stable patients with splenic injury and active contrast leakage on CT. It is not appropriate in refractory shock.`},
k:`An unstable blunt trauma patient with a positive FAST needs emergency exploratory laparotomy; CT and angioembolization are reserved for stable patients.`},

{s:'Urology',
q:`A 66-year-old man comes to the office because he has noticed red urine with small clots twice in the past month. He has had no pain with urination, urinary frequency, flank pain, fever, recent injury, or strenuous exercise. He has a 40-pack-year smoking history and worked for 30 years in a factory that made rubber and dyes. He takes no blood thinners. Blood pressure is 134/82 mm Hg. There is no abdominal mass or flank tenderness. Rectal examination shows a smooth, mildly enlarged, nontender prostate without nodules. Laboratory results are as follows:`,
lab:[['Urinalysis'],['Red blood cells','>50/hpf, uniform shape'],['White blood cells','2/hpf'],['Protein','Negative'],['Nitrites','Negative'],['Casts','None'],['Urine culture','No growth'],['Serum creatinine','0.9 mg/dL'],['Prostate-specific antigen','1.8 ng/mL']],
ask:`Which of the following is the most appropriate next step in evaluation?`,
o:['Empiric ciprofloxacin and repeat urinalysis in 2 weeks','Kidney biopsy','Repeat urinalysis in 3 months','Cystoscopy and CT urography','Prostate biopsy'],a:3,
