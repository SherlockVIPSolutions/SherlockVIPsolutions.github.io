<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Level Bank – USMLE Step 2 CK question bank</title>

<style>
:root{--bg:#f2f5f8;--surface:#fff;--ink:#12202e;--muted:#5a6b7b;--line:#dbe3ea;--brand:#0b3a5b;--accent:#0e8f83;--accent-d:#0a6f66;--good:#1b8a4b;--bad:#c2372f;--warn:#b9770e;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0d1620;--surface:#15222f;--ink:#e8eef4;--muted:#9bacbc;--line:#27394a;--brand:#0a2336;--accent:#2bb5a7;--accent-d:#4cd0c2;--good:#4cc27e;--bad:#ef6b62;--warn:#e0a24a}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;display:flex;flex-direction:column;min-height:100vh}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10}
.bar{max-width:1100px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:18px;min-height:58px}
.logo{font-weight:800;font-size:20px;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:15px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{color:#c9d8e5;text-decoration:none;padding:8px 11px;border-radius:7px;font-size:14px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.1);color:#fff}
nav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
#menu{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:6px 12px;font:inherit}
main{max-width:1100px;width:100%;margin:0 auto;padding:28px 20px 60px;flex:1}
h1{font-size:clamp(28px,4.5vw,44px);line-height:1.12;margin:0 0 12px;letter-spacing:-.02em;font-weight:800}
h2{font-size:24px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 12px}.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid .card{margin:0}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--accent-d)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{background:var(--bg)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:20px 0 30px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 12px 30px rgba(11,58,91,.12)}
.preview .o{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:8px;font-size:14px}
.preview .o.ok{border-color:var(--good);background:rgba(27,138,75,.1)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.stats b{font-size:26px;display:block;line-height:1.1}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{margin:0;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;background:var(--bg)}
.chk label:has(input:checked){border-color:var(--accent);background:rgba(14,143,131,.14);font-weight:700}
.chk input{accent-color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.narrow{max-width:460px;margin:0 auto}
.notice{border-left:4px solid var(--warn);background:rgba(185,119,14,.1);padding:12px 16px;border-radius:6px;margin-bottom:18px;font-size:15px}
.notice a{color:var(--accent-d);font-weight:700}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.prog div{height:100%;background:var(--accent);transition:width .3s}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:12px 14px;margin-top:9px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.opt.sel{border-color:var(--accent);background:rgba(14,143,131,.12)}
.opt.ok{border-color:var(--good);background:rgba(27,138,75,.14)}
.opt.no{border-color:var(--bad);background:rgba(194,55,47,.12)}
.exp{background:var(--bg);border-radius:8px;padding:14px;margin-top:16px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.row.sp{justify-content:space-between}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--muted);font-weight:700;font-size:13px}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(14,143,131,.15);color:var(--accent-d)}
.score{font-size:56px;font-weight:800;line-height:1}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:700}
.amts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.amts button{padding:10px 18px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.amts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}
footer{border-top:1px solid var(--line);text-align:center;padding:22px 20px;color:var(--muted);font-size:14px}footer p{margin:0 0 4px}.flinks{display:flex;justify-content:center;gap:24px;margin-bottom:14px}.flinks a{color:var(--ink);font-weight:700;text-decoration:none}.flinks a:hover,.flinks a.on{color:var(--accent-d);text-decoration:underline}.chk label:has(input:disabled){opacity:.5;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px}
@media(max-width:820px){.hero{grid-template-columns:1fr}#menu{display:block}nav{display:none;width:100%;flex-direction:column;margin:0 0 12px}nav.open{display:flex}.bar{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<nav id="nav"></nav>
</div></header>
<main id="app"></main>

<div id="toast" role="status"></div>

<script>
/* ---------- Data ---------- */
const BANK=[
["Biostatistics","Which test characteristic does not change with disease prevalence?",["Positive predictive value","Negative predictive value","Sensitivity","Overall accuracy"],2,"Sensitivity and specificity are fixed properties of the test. Predictive values and accuracy shift as prevalence changes."],
["Cardiology","A 58-year-old man has crushing chest pain. ECG shows ST elevation in leads II, III and aVF. Which artery is most likely occluded?",["Left anterior descending","Right coronary artery","Left circumflex","Left main coronary"],1,"Inferior leads (II, III, aVF) reflect the inferior wall, supplied by the right coronary artery in most people."],
["Cardiology","A 60-year-old man with hypertension starts lisinopril and develops a persistent dry cough. What is the best next step?",["Switch to an angiotensin receptor blocker","Add a beta-blocker","Start an inhaled corticosteroid","Order a chest CT"],0,"ACE inhibitors raise bradykinin, which triggers cough. ARBs treat hypertension without affecting bradykinin."],
["Dermatology","A 70-year-old man has a pearly papule with telangiectasias and rolled borders on his nose. What is the most likely diagnosis?",["Squamous cell carcinoma","Basal cell carcinoma","Melanoma","Seborrheic keratosis"],1,"Basal cell carcinoma is the most common skin cancer and typically appears as a pearly, telangiectatic papule on sun-exposed skin."],
["Endocrinology","A man with type 1 diabetes has diabetic ketoacidosis with glucose 520 mg/dL and potassium 3.0 mEq/L. What is the best next step?",["Start an insulin infusion immediately","Replace potassium before starting insulin","Give intravenous bicarbonate","Give oral glucose"],1,"Insulin drives potassium into cells. If potassium is below 3.3 mEq/L, replace it first to avoid arrhythmias."],
["ENT","A 22-year-old has severe unilateral sore throat, trismus, a muffled “hot potato” voice and uvular deviation. What is the most likely diagnosis?",["Epiglottitis","Peritonsillar abscess","Streptococcal pharyngitis","Infectious mononucleosis"],1,"Peritonsillar abscess is treated with needle aspiration or incision and drainage plus antibiotics."],
["Gastroenterology","A 65-year-old woman has fever, jaundice and right upper quadrant pain. What is the most likely diagnosis?",["Acute cholecystitis","Ascending cholangitis","Hepatitis A","Pancreatic cancer"],1,"This is Charcot triad. Adding hypotension and confusion makes Reynolds pentad. Treat with antibiotics and biliary decompression (ERCP)."],
["Gynecology","A sexually active 22-year-old woman has fever, lower abdominal pain and cervical motion tenderness. What is the most likely diagnosis?",["Endometriosis","Ovarian torsion","Pelvic inflammatory disease","Appendicitis"],2,"Cervical motion tenderness suggests pelvic inflammatory disease. Treat empirically to cover gonorrhea, chlamydia and anaerobes."],
["Hematology","Which laboratory pattern is most consistent with iron deficiency anemia?",["Low ferritin and high TIBC","High ferritin and low TIBC","Low ferritin and low TIBC","High ferritin and high TIBC"],0,"Iron deficiency lowers ferritin and raises TIBC. Anemia of chronic disease shows high ferritin and low TIBC."],
["Infectious Disease","Below which CD4 count should Pneumocystis pneumonia prophylaxis be started in a patient with HIV?",["500 cells/µL","350 cells/µL","200 cells/µL","50 cells/µL"],2,"Start trimethoprim-sulfamethoxazole when CD4 falls below 200 cells/µL."],
["Musculoskeletal","Joint fluid from an inflamed great toe shows needle-shaped crystals with negative birefringence. What is the diagnosis?",["Pseudogout","Septic arthritis","Gout","Osteoarthritis"],2,"Gout produces monosodium urate crystals: needle-shaped and negatively birefringent. Pseudogout crystals are rhomboid and positively birefringent."],
["Multisystem","What is the antidote for acetaminophen overdose?",["Naloxone","Flumazenil","Atropine","N-acetylcysteine"],3,"N-acetylcysteine replenishes glutathione and binds the toxic metabolite NAPQI. It works best when given early."],
["Neurology","A 45-year-old man has a sudden “worst headache of his life.” What is the first imaging study?",["Noncontrast CT of the head","MRI of the brain with contrast","Cerebral angiography","Lumbar puncture before any imaging"],0,"Noncontrast CT is the fastest, most sensitive test for subarachnoid hemorrhage in the first hours. Do a lumbar puncture if CT is negative and suspicion remains."],
["Obstetrics","A woman at 34 weeks’ gestation has a blood pressure of 165/110 mm Hg and a seizure. Which drug best prevents further seizures?",["Phenytoin","Diazepam","Magnesium sulfate","Levetiracetam"],2,"Magnesium sulfate is first-line for seizure treatment and prophylaxis in eclampsia. Delivery is the definitive treatment."],
["Oncology","Which tumor marker is most useful for monitoring hepatocellular carcinoma?",["CA-125","Alpha-fetoprotein","CEA","PSA"],1,"Alpha-fetoprotein is elevated in hepatocellular carcinoma. CA-125 tracks ovarian cancer, CEA colorectal cancer and PSA prostate cancer."],
["Ophthalmology","A 68-year-old has sudden painless vision loss in one eye. Fundoscopy shows a pale retina with a cherry-red macula. What is the diagnosis?",["Central retinal vein occlusion","Retinal detachment","Acute angle-closure glaucoma","Central retinal artery occlusion"],3,"Central retinal artery occlusion is an ophthalmic emergency, often from carotid emboli. Evaluate for stroke and carotid disease."],
["Pediatrics","A 2-year-old has a barking cough, inspiratory stridor and a steeple sign on neck X-ray. What is the best initial treatment?",["Oral amoxicillin","Dexamethasone","Inhaled albuterol","Intubation"],1,"Croup is usually viral and responds to a single dose of dexamethasone. Add nebulized epinephrine for moderate to severe stridor."],
["Primary Care","A 55-year-old current smoker with a 30 pack-year history is due for cancer screening. What is recommended?",["Annual chest X-ray","Sputum cytology","Annual low-dose chest CT","No screening"],2,"Screen adults aged 50 to 80 with at least a 20 pack-year history who smoke now or quit within 15 years using annual low-dose CT."],
["Psychiatry","Which is first-line pharmacotherapy for major depressive disorder?",["Selective serotonin reuptake inhibitor","Monoamine oxidase inhibitor","Benzodiazepine","Tricyclic antidepressant"],0,"SSRIs are first-line because they are effective and safer in overdose than tricyclics or MAO inhibitors."],
["Pulmonary","Which organism most commonly causes community-acquired pneumonia in adults?",["Klebsiella pneumoniae","Streptococcus pneumoniae","Legionella pneumophila","Haemophilus influenzae"],1,"Streptococcus pneumoniae is the most common bacterial cause. Look for lobar consolidation and rust-colored sputum."],
["Renal","A patient with hyperkalemia has peaked T waves and a widened QRS. What is the best first step?",["Intravenous calcium gluconate","Oral sodium polystyrene","Furosemide alone","Hemodialysis"],0,"Calcium stabilizes the cardiac membrane within minutes. Follow with insulin and glucose, albuterol, and then potassium removal."],
["Surgery","A hypotensive trauma patient has a positive FAST exam. What is the next step?",["CT of the abdomen","Observation","Exploratory laparotomy","Diagnostic peritoneal lavage"],2,"Unstable patients with a positive FAST go straight to the operating room. CT is only for stable patients."],
["Urology","A 65-year-old smoker has painless gross hematuria. What is the best next step?",["Cystoscopy","Urine culture and antibiotics","Reassurance","Repeat urinalysis in 6 months"],0,"Painless hematuria in a smoker suggests urothelial carcinoma until proven otherwise. Evaluate with cystoscopy and upper-tract imaging."]
].map((a,i)=>({id:i,subj:a[0],q:a[1],opts:a[2],ans:a[3],exp:a[4]}));
const SUBJECTS=['Biostatistics','Cardiology','Dermatology','Endocrinology','ENT','Gastroenterology','Gynecology','Hematology','Infectious Disease','Musculoskeletal','Multisystem','Neurology','Obstetrics','Oncology','Ophthalmology','Pediatrics','Primary Care','Psychiatry','Pulmonary','Renal','Surgery','Urology'];

/* ---------- Helpers & storage ---------- */
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=st=>({get(k,d){try{const v=JSON.parse(st.getItem(k));return v??d}catch{return d}},set(k,v){try{st.setItem(k,JSON.stringify(v))}catch{}}});
const LS=mk(window.localStorage),SS=mk(window.sessionStorage);
const users=()=>LS.get('qb_users',{}), saveUsers=u=>LS.set('qb_users',u);
const me=()=>{const e=LS.get('qb_session',null);return e?users()[e]||null:null};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('qb:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const getTests=()=>{const u=me();return u?u.tests||[]:SS.get('qb_guest',[])};
function addTest(t){const u=me();if(u){const all=users();all[u.email].tests=[t,...(u.tests||[])];saveUsers(all)}else SS.set('qb_guest',[t,...SS.get('qb_guest',[])])}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const L='ABCD';
let run=null, acctTab='in', amt=25;

/* ---------- Pages ---------- */
const NAV=[['home','Home'],['create','Create a test'],['prior','Prior tests'],['search','Search'],['services','More services'],['donate','Donate'],['account','Account']];
const notice=()=>me()?'':`<div class="notice">You’re using Next Level Bank as a guest. Tests are kept only until you close this tab. <a href="#/account">Create a free account</a> to save them.</div>`;

const pages={
home(){return`
<section class="hero"><div>
<h1>Practice questions that reinforce deep concepts.</h1>
<p class="muted" style="font-size:18px;max-width:520px">A USMLE STEP2CK bank to teaches you the "why".</p>
<div class="acts"><a class="btn" href="#/create">Create a test</a><a class="btn alt" href="#/prior">Review prior tests</a></div>
<div class="stats"><div><b>${BANK.length}</b><span class="muted">sample questions</span></div><div><b>${SUBJECTS.length}</b><span class="muted">topics</span></div><div><b>Free</b><span class="muted">to use</span></div></div>
</div>
<div class="preview"><span class="pill">Cardiology</span><p style="margin:12px 0 4px;font-weight:700">A man on lisinopril develops a persistent dry cough. What is the best next step?</p>
<div class="o ok">A. Switch to an angiotensin receptor blocker</div><div class="o">B. Add a beta-blocker</div><div class="o">C. Start an inhaled corticosteroid</div><div class="o">D. Obtain a chest x-ray</div><div class="o">E. Start prednisone </div> 
<p class="muted" style="font-size:14px;margin:12px 0 0">ACE inhibitors raise bradykinin, which triggers cough…</p></div></section>
<div class="grid">
<div class="card"><h3>Build your own test for free</h3><p class="muted">Pick topics, question count and a mode: tutor or test.</p></div>
<div class="card"><h3>Learn from every answer</h3><p class="muted">Explanations are written by an experienced tutor to review both the correct and incorrect answer choices.</p></div>
<div class="card"><h3>Track your progress</h3><p class="muted">Sign in free to save every test and come back to review it any time.</p></div></div>`},

create(){return`${notice()}<h1 style="font-size:32px">Create a test</h1>
<div class="card"><div class="row sp" style="margin:0"><label style="margin:0">Topics</label><span><button class="btn alt" style="padding:6px 12px" data-act="all" data-v="1">Select all</button> <button class="btn alt" style="padding:6px 12px" data-act="all" data-v="0">Clear</button></span></div><div class="chk" id="subjs" style="margin-top:10px">
${SUBJECTS.map(s=>{const c=BANK.filter(q=>q.subj===s).length;return`<label><input type="checkbox" value="${s}" ${c?'checked':'disabled'}>${s}${c?'':' (soon)'}</label>`}).join('')}</div>
<label for="n">Number of questions (max ${BANK.length})</label><input id="n" type="number" min="1" max="${BANK.length}" value="10">
<label for="mode">Mode</label><select id="mode"><option value="tutor">Tutor: see the explanation after each question</option><option value="timed">Test: see all explanations at the end</option></select>
<div class="err" id="cerr"></div><div class="row"><button class="btn" data-act="start">Start test</button></div></div>`},

prior(){const t=getTests();
return`${notice()}<h1 style="font-size:32px">Prior tests</h1>`+(t.length?`<div class="card tbl"><table><thead><tr><th>Date</th><th>Mode</th><th>Topics</th><th>Score</th><th></th></tr></thead><tbody>
${t.map((x,i)=>`<tr><td>${new Date(x.date).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}</td><td>${x.mode==='tutor'?'Tutor':'Test'}</td><td>${x.subjs.length>3?x.subjs.length+' topics':x.subjs.map(esc).join(', ')}</td><td><b>${x.score}/${x.items.length}</b> (${Math.round(100*x.score/x.items.length)}%)</td><td><button class="btn alt" data-act="review" data-i="${i}">Review</button></td></tr>`).join('')}
</tbody></table></div>`:`<div class="card"><h3>No tests yet</h3><p class="muted">Finished tests show up here.</p><a class="btn" href="#/create">Create a test</a></div>`)},

search(){return`<h1 style="font-size:32px">Search questions</h1><div class="card"><label for="sq" style="margin-top:0">Search by topic, keyword or subject</label><input id="sq" type="search" placeholder="e.g. hyperkalemia, croup, hematuria"></div><div id="sres"></div>`},

about(){return`<h1 style="font-size:32px">About Next Level Bank</h1><div class="card"><p>Next Level Bank is a free question bank for USMLE Step 2 CK that teaches you the why. Every question comes with an explanation so you learn the concept, not just the answer.</p>
<p>This site is a static demo hosted on GitHub Pages. Accounts and saved tests live in your own browser and are not sent to a server.</p>
<p class="muted">Next Level Bank is a trademark of Sherlock VIP Solutions and is not affiliated with the NBME, the FSMB or any other question bank provider.</p></div>`},

services(){const s=[['Flashcards','Turn missed questions into spaced-repetition cards.'],['Study planner','Set an exam date and get a daily question target.'],['Performance reports','See accuracy by subject and over time.'],['Group study','Share a test with classmates and compare scores.'],['Mobile app','Practice on the go, even offline.'],['Tutoring','Book a session with an experienced tutor.']];
return`<h1 style="font-size:32px">More services</h1><p class="muted">Planned additions. Tell us which you want most on the <a href="#/help" style="color:var(--accent-d)">Help page</a>.</p><div class="grid">${s.map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted" style="margin:0">${x[1]}</p></div>`).join('')}</div>`},

donate(){return`<h1 style="font-size:32px">Donate</h1><div class="card narrow" style="margin-left:0"><p>Next Level Bank stays free through donations. Choose an amount to support new questions and features.</p>
<div class="amts" id="amts">${[10,25,50,100].map(a=>`<button data-act="amt" data-a="${a}" class="${a===amt?'on':''}">$${a}</button>`).join('')}</div>
<label for="oth">Other amount ($)</label><input id="oth" type="number" min="1" placeholder="Enter amount">
<div class="row"><button class="btn" data-act="donate">Donate</button></div>
<p class="muted" style="font-size:13px;margin-top:14px">Demo only: no payment is processed. To accept real donations, link this button to your Stripe, PayPal or GitHub Sponsors page.</p></div>`},

help(){const f=[['Do I need an account to take a test?','No. You can create and take tests as a guest.'],['How do I save my tests?','Create a free account and sign in. Tests finished while signed in are saved automatically.'],['What happens to guest tests?','They stay available under Prior tests until you close the browser tab.'],['What is the difference between Tutor and Test mode?','Tutor shows the explanation right after each answer. Test mode shows everything at the end.'],['I forgot my password.','Accounts are stored only in your browser, so passwords cannot be recovered. Create a new account.'],['Where is my data stored?','In your browser’s local storage on this device. Clearing site data removes it.']];
return`<h1 style="font-size:32px">Help</h1><div class="card">${f.map(x=>`<details><summary>${x[0]}</summary><p class="muted" style="margin:8px 0 0">${x[1]}</p></details>`).join('')}</div>
<div class="card"><h3>Contact us</h3><p class="muted" style="margin:0">Email <a href="mailto:support@example.com" style="color:var(--accent-d)">support@example.com</a> (replace with your address).</p></div>`},

account(){const u=me();
if(!u)return`<div class="narrow"><div class="card"><h2>${acctTab==='in'?'Sign in':'Create a free account'}</h2>
<div class="tabs"><button data-act="tab" data-t="in" class="${acctTab==='in'?'on':''}">Sign in</button><button data-act="tab" data-t="up" class="${acctTab==='up'?'on':''}">Create account</button></div>
<form id="authf" novalidate>${acctTab==='up'?`<label for="un" style="margin-top:0">User name</label><input id="un" type="text" autocomplete="username">`:''}
<label for="em" ${acctTab==='in'?'style="margin-top:0"':''}>Email</label><input id="em" type="email" autocomplete="email">
<label for="pw">Password${acctTab==='up'?' (8+ characters)':''}</label><input id="pw" type="password" autocomplete="${acctTab==='in'?'current-password':'new-password'}">
<div class="err" id="aerr"></div><button class="btn" style="width:100%" type="submit">${acctTab==='in'?'Sign in':'Create account'}</button></form></div></div>`;
return`<h1 style="font-size:32px">Account settings</h1>
<div class="card"><h3>Profile</h3><p class="muted">${(u.tests||[]).length} saved test${(u.tests||[]).length===1?'':'s'}</p>
<form id="prof" novalidate><label for="pn">User name</label><input id="pn" type="text" value="${esc(u.name)}"><label for="pe">Email</label><input id="pe" type="email" value="${esc(u.email)}"><div class="err" id="perr"></div><button class="btn" type="submit">Save changes</button></form></div>
<div class="card"><h3>Change password</h3><form id="cpf" novalidate><label for="op">Current password</label><input id="op" type="password" autocomplete="current-password"><label for="np">New password (8+ characters)</label><input id="np" type="password" autocomplete="new-password"><div class="err" id="cperr"></div><button class="btn" type="submit">Update password</button></form></div>
<div class="card"><h3>Session</h3><button class="btn alt" data-act="logout">Sign out</button></div>
<div class="card" style="border-color:var(--bad)"><h3>Delete account</h3><p class="muted">This permanently removes your account and all saved tests from this browser.</p><button class="btn danger" data-act="delacct">Delete account</button></div>`}
};

/* ---------- Test runner ---------- */
function qView(){const r=run,q=r.qs[r.i],a=r.ans[r.i],shown=r.mode==='tutor'&&r.done[r.i];
return`<div class="card"><div class="q-top"><span>Question ${r.i+1} of ${r.qs.length}</span><span class="pill">${q.subj}</span></div>
<div class="prog"><div style="width:${(r.i+(shown?1:0))/r.qs.length*100}%"></div></div>
<p style="font-size:18px;font-weight:700">${esc(q.q)}</p>
${q.opts.map((o,k)=>{let c='opt';if(shown){if(k===q.ans)c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel';return`<button class="${c}" data-act="pick" data-k="${k}" ${shown?'disabled':''}><b>${L[k]}</b><span>${esc(o)}</span></button>`}).join('')}
${shown?`<div class="exp"><b>${a===q.ans?'Correct.':'Incorrect.'}</b> ${esc(q.exp)}</div>`:''}
<div class="row sp"><button class="btn alt" data-act="quit">End test</button><span>
${r.mode==='tutor'&&!shown?`<button class="btn" data-act="check" ${a==null?'disabled':''}>Submit answer</button>`:(r.i<r.qs.length-1?`<button class="btn" data-act="next" ${a==null?'disabled':''}>Next question</button>`:`<button class="btn" data-act="finish" ${a==null?'disabled':''}>Finish test</button>`)}</span></div></div>`}
function startTest(){
const subjs=[...document.querySelectorAll('#subjs input:checked')].map(i=>i.value),pool=BANK.filter(q=>subjs.includes(q.subj));
let n=Math.max(1,parseInt($('#n').value)||0);
if(!subjs.length)return $('#cerr').textContent='Select at least one topic.';
n=Math.min(n,pool.length);
const qs=shuffle(pool).slice(0,n).map(q=>{const idx=shuffle(q.opts.map((_,i)=>i));return{...q,opts:idx.map(i=>q.opts[i]),ans:idx.indexOf(q.ans)}});
run={qs,i:0,ans:[],done:[],mode:$('#mode').value,subjs};
app.innerHTML=qView();window.scrollTo(0,0)}
function finish(){const r=run,score=r.qs.filter((q,i)=>r.ans[i]===q.ans).length;
const t={date:Date.now(),mode:r.mode,subjs:r.subjs,score,items:r.qs.map((q,i)=>({q:q.q,subj:q.subj,opts:q.opts,ans:q.ans,exp:q.exp,pick:r.ans[i]??null}))};
addTest(t);run=null;app.innerHTML=results(t,true)}
function results(t,fresh){const pct=Math.round(100*t.score/t.items.length);
return`${fresh?(me()?`<div class="notice" style="border-color:var(--good)">Test saved to your account.</div>`:`<div class="notice">This test is not saved to an account. <a href="#/account">Create a free account</a> to keep future tests.</div>`):''}
<div class="card"><h1 style="font-size:28px">Results</h1><div class="score">${pct}%</div><p class="muted">${t.score} of ${t.items.length} correct · ${t.mode==='tutor'?'Tutor':'Test'} mode</p>
<div class="row"><a class="btn" href="#/create">New test</a><a class="btn alt" href="#/prior">Prior tests</a></div></div>
<h2>Review</h2>`+t.items.map((x,i)=>`<div class="card"><div class="q-top"><span>Question ${i+1}</span><span class="pill">${esc(x.subj)}</span></div><p style="font-weight:700">${esc(x.q)}</p>
${x.opts.map((o,k)=>`<div class="opt ${k===x.ans?'ok':k===x.pick?'no':''}" style="cursor:default"><b>${L[k]}</b><span>${esc(o)}${k===x.pick?' (your answer)':''}${k===x.ans?' (correct)':''}</span></div>`).join('')}
<div class="exp">${esc(x.exp)}</div></div>`).join('')}

/* ---------- Router ---------- */
function route(){const key=(location.hash.replace(/^#\/?/,'')||'home').split('/')[0];const k=pages[key]?key:'home';
if(run&&k!=='create'&&false)return;
run=null;
$('#nav').innerHTML=NAV.map(([id,l])=>`<a href="#/${id}" class="${id===k?'on':''}">${l==='Account'&&me()?esc(me().name):l}</a>`).join('');
$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
app.innerHTML=pages[k]();document.title=(k==='home'?'Next Level Bank':((NAV.find(n=>n[0]===k)||[0,k[0].toUpperCase()+k.slice(1)])[1])+' – Next Level Bank');document.querySelectorAll('.flinks a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+k));
window.scrollTo(0,0);if(k==='search')doSearch('')}
function doSearch(v){v=v.trim().toLowerCase();const r=BANK.filter(q=>!v||(q.q+q.subj+q.exp+q.opts.join(' ')).toLowerCase().includes(v));
$('#sres').innerHTML=r.length?`<p class="muted">${r.length} result${r.length>1?'s':''}</p>`+r.map(q=>`<div class="card"><span class="pill">${q.subj}</span><details><summary>${esc(q.q)}</summary><p style="margin:10px 0 4px"><b>Answer:</b> ${esc(q.opts[q.ans])}</p><p class="muted" style="margin:0">${esc(q.exp)}</p></details></div>`).join(''):`<div class="card"><h3>No matches</h3><p class="muted" style="margin:0">Try a shorter keyword or a subject name.</p></div>`}

/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a==='start')startTest();
else if(a==='all')document.querySelectorAll('#subjs input:not(:disabled)').forEach(i=>i.checked=b.dataset.v==='1');
else if(a==='pick'){run.ans[run.i]=+b.dataset.k;app.innerHTML=qView()}
else if(a==='check'){run.done[run.i]=true;app.innerHTML=qView()}
else if(a==='next'){run.i++;app.innerHTML=qView();window.scrollTo(0,0)}
else if(a==='finish')finish();
else if(a==='quit'){if(confirm('End this test? Your progress will not be saved.')){run=null;location.hash='#/create';route()}}
else if(a==='review'){app.innerHTML=results(getTests()[+b.dataset.i],false);window.scrollTo(0,0)}
else if(a==='amt'){amt=+b.dataset.a;$('#oth').value='';document.querySelectorAll('#amts button').forEach(x=>x.classList.toggle('on',x===b))}
else if(a==='donate'){const v=+$('#oth').value||amt;toast(`Thank you for considering a $${v} donation! (demo)`)}
else if(a==='tab'){acctTab=b.dataset.t;app.innerHTML=pages.account()}
else if(a==='logout'){LS.set('qb_session',null);toast('Signed out');route()}
else if(a==='delacct'){if(confirm('Permanently delete your account and all saved tests?')){const u=users();delete u[me().email];saveUsers(u);LS.set('qb_session',null);toast('Account deleted');route()}}
});
document.addEventListener('input',e=>{if(e.target.id==='sq')doSearch(e.target.value);if(e.target.id==='oth'&&e.target.value)document.querySelectorAll('#amts button').forEach(x=>x.classList.remove('on'))});
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id,v=i=>($('#'+i)||{}).value||'',err=(i,m)=>$('#'+i).textContent=m,okE=s=>/^\S+@\S+\.\S+$/.test(s);
if(id==='authf'){const em=v('em').trim().toLowerCase(),pw=v('pw'),all=users();
 if(!okE(em))return err('aerr','Enter a valid email address.');
 if(acctTab==='up'){const nm=v('un').trim();if(!nm)return err('aerr','Enter a user name.');if(pw.length<8)return err('aerr','Use a password of at least 8 characters.');if(all[em])return err('aerr','An account with this email already exists. Sign in instead.');
  all[em]={name:nm,email:em,hash:await sha(pw),tests:SS.get('qb_guest',[])};saveUsers(all);LS.set('qb_session',em);SS.set('qb_guest',[]);toast('Account created. Guest tests were added.')}
 else{if(!all[em]||all[em].hash!==await sha(pw))return err('aerr','Email or password is incorrect.');LS.set('qb_session',em);toast('Signed in')}
 route()}
else if(id==='prof'){const u=me(),nm=v('pn').trim(),em=v('pe').trim().toLowerCase(),all=users();
 if(!nm)return err('perr','Enter a user name.');if(!okE(em))return err('perr','Enter a valid email address.');if(em!==u.email&&all[em])return err('perr','That email is already in use.');
 delete all[u.email];all[em]={...u,name:nm,email:em};saveUsers(all);LS.set('qb_session',em);toast('Changes saved');route()}
else if(id==='cpf'){const u=me(),all=users();
 if(u.hash!==await sha(v('op')))return err('cperr','Current password is incorrect.');if(v('np').length<8)return err('cperr','New password must be at least 8 characters.');
 all[u.email].hash=await sha(v('np'));saveUsers(all);toast('Password updated');route()}
});
$('#menu').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',o)};
$('#yr').textContent=new Date().getFullYear();
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
