<script>
/* ---------- Question bank ----------
   s: topic · q: vignette (blank line = new paragraph) · lab: rows ([label] = section header) · fig: ECG or image
   ask: lead-in · o: choices · a: index of correct choice · e: explanation paragraphs
   w: incorrect choices keyed by letter (as written here) · k: educational objective
   fix: keep choices in the written order (otherwise a fixed, per-question order is applied) */
const QDATA=[
{s:'Biostatistics',
q:`A hospital laboratory validates a new rapid antigen test for influenza in its emergency department during peak influenza season, when 30% of tested patients have influenza confirmed by reverse-transcription PCR. In this setting, the test is positive in 85% of patients with influenza and negative in 95% of patients without influenza. The positive predictive value is 88%, and the negative predictive value is 94%.

The hospital's outpatient clinics plan to use the same test kit during the summer, when PCR-confirmed influenza is present in only 2% of tested patients. The specimen collection technique, the laboratory performing the test, and the reference standard will not change.`,
ask:`Which of the following values is expected to remain the same in the outpatient summer setting?`,
o:['Negative predictive value','Number of false-positive results per 1,000 patients tested','Overall accuracy','Sensitivity','Positive predictive value'],a:3,
e:[`Sensitivity (the proportion of patients with disease who test positive) and specificity (the proportion of patients without disease who test negative) are each calculated within a single group: the diseased or the nondiseased. Because each is a ratio within one column of the 2 × 2 table, neither depends on how many people in the population have the disease. As long as the test, the specimen technique, and the reference standard are unchanged, sensitivity will remain 85% and specificity 95%.`,
`Predictive values, in contrast, are calculated across both groups and shift with prevalence. Per 1,000 patients at 30% prevalence, there are 255 true positives and 35 false positives (PPV 255/290 ≈ 88%). At 2% prevalence, there are only 17 true positives but 49 false positives (PPV 17/66 ≈ 26%). As prevalence falls, PPV falls and NPV rises.`],
w:{A:`Negative predictive value increases as prevalence decreases because almost everyone who tests negative truly lacks disease. Here it rises from about 94% (665/710) to about 99.7% (931/934).`,
B:`The number of false positives depends on how many patients without disease are tested. With 980 nondiseased patients per 1,000 (instead of 700), false positives rise from 35 to 49 even though specificity is unchanged.`,
C:`Overall accuracy ([true positives + true negatives]/all patients) is an average of sensitivity and specificity weighted by prevalence. As the population shifts toward nondiseased patients, accuracy moves toward specificity (92% → about 95%).`,
E:`Positive predictive value falls sharply in low-prevalence populations because false positives begin to outnumber true positives (88% → about 26%). This is why screening low-risk populations generates many false-positive results.`},
k:`Sensitivity and specificity are intrinsic test characteristics that do not change with disease prevalence. Positive predictive value rises and negative predictive value falls as prevalence increases.`},

{s:'Cardiology',
q:`A 61-year-old man is brought to the emergency department 45 minutes after the onset of substernal pressure that radiates to his jaw. He is nauseated and has vomited once. He has hypertension, hyperlipidemia, and a 35-pack-year smoking history. Blood pressure is 94/60 mm Hg, pulse is 48/min, and respirations are 20/min. Oxygen saturation is 96% on room air. He is diaphoretic. Jugular venous pressure is elevated at 11 cm H2O, but the lungs are clear to auscultation bilaterally. There are no murmurs. An ECG is obtained; the limb leads are shown below. Initial high-sensitivity troponin T is 42 ng/L (reference: <14 ng/L).`,
fig:{ecg:'inferior',cap:'Limb leads.'},
ask:`Occlusion of which of the following arteries is most likely responsible for this patient's presentation?`,
o:['Diagonal branch of the left anterior descending artery','Left anterior descending artery','Left circumflex artery','Right coronary artery','Left main coronary artery'],a:3,
e:[`This patient's ECG shows ST-segment elevation in the inferior leads (II, III, aVF) with reciprocal ST depression in leads I and aVL, consistent with an acute inferior ST-elevation myocardial infarction (STEMI). The inferior wall is supplied by the posterior descending artery, which arises from the right coronary artery (RCA) in about 80%–85% of people (right-dominant circulation). ST elevation that is greater in lead III than in lead II, together with reciprocal depression in lead I, favors RCA rather than circumflex occlusion.`,
`His bradycardia, hypotension, elevated jugular venous pressure, and clear lungs are also explained by RCA occlusion. The RCA supplies the sinoatrial node in about 60% of people and the atrioventricular node in about 85%–90%, and proximal RCA occlusion frequently causes right ventricular infarction. Right-sided leads (ST elevation ≥1 mm in V4R) confirm right ventricular involvement. These patients are preload dependent, so nitrates and diuretics should be avoided and hypotension treated with intravenous fluids. Definitive treatment is emergency percutaneous coronary intervention.`],
w:{A:`Occlusion of a diagonal branch of the LAD causes a lateral infarction, with ST elevation typically in leads I, aVL, and sometimes V5–V6. Inferior ST elevation would not be expected.`,
B:`Left anterior descending artery occlusion causes an anterior or anteroseptal STEMI with ST elevation in V1–V4. Anterior infarctions are more often complicated by left ventricular failure (pulmonary edema) than by bradycardia.`,
C:`The left circumflex artery supplies the lateral wall and, in left-dominant circulations (about 10%), gives rise to the posterior descending artery. Circumflex occlusion can produce inferior ST elevation, but it is usually accompanied by lateral ST elevation (I, aVL, V5–V6) rather than reciprocal depression in I and aVL, and ST elevation tends to be greater in lead II than in lead III.`,
E:`Left main coronary occlusion compromises both the LAD and circumflex territories. It typically causes diffuse ST depression with ST elevation in aVR and usually leads to cardiogenic shock rather than an isolated inferior pattern.`},
k:`Inferior STEMI (ST elevation in II, III, aVF) is most often caused by right coronary artery occlusion. Bradycardia, AV block, and right ventricular infarction (hypotension, elevated JVP, clear lungs) are clues; avoid nitrates and give fluids for hypotension.`},

{s:'Dermatology',
q:`A 71-year-old man comes to the office because of a lesion on his left nasal ala that has slowly enlarged over the past 8 months. It occasionally bleeds after he washes his face and then crusts over, but it never fully heals. He worked outdoors as a farmer for 45 years. Examination shows a 7-mm firm papule with a slightly raised, shiny, translucent border, a small central erosion, and fine branching vessels on its surface. A lesion of the same type is shown below. There is no cervical or preauricular lymphadenopathy. The remainder of the skin examination shows several rough, scaly, erythematous macules on the scalp and the backs of both hands.`,
fig:{img:'https://commons.wikimedia.org/wiki/Special:FilePath/Basal_cell_carcinoma.jpg?width=640',cap:'Representative lesion. Image: National Cancer Institute (public domain), via Wikimedia Commons.',alt:'Skin lesion with a raised translucent border'},
ask:`Which of the following is the most likely diagnosis of the nasal lesion?`,
o:['Actinic keratosis','Basal cell carcinoma','Keratoacanthoma','Nodular melanoma','Squamous cell carcinoma'],a:1,
e:[`Basal cell carcinoma (BCC) is the most common cancer in the United States. Major risk factors include chronic ultraviolet exposure, fair skin, older age, and immunosuppression. Nodular BCC, the most common subtype, presents as a slowly enlarging, skin-colored to pink papule or nodule with a translucent quality, a raised border, and arborizing telangiectasias. Central ulceration with recurrent bleeding and crusting (a sore that does not heal) is common. Lesions favor sun-exposed areas of the head and neck, especially the nose.`,
`BCC is locally invasive but rarely metastasizes. Diagnosis is confirmed by shave or punch biopsy. Mohs micrographic surgery is preferred for lesions on the central face (including the nose), recurrent tumors, and aggressive histologic subtypes because it allows complete margin assessment while sparing tissue. Standard excision with 4-mm margins is appropriate for low-risk lesions on the trunk and extremities. The scaly macules on his scalp and hands are likely actinic keratoses, reflecting cumulative sun damage, and warrant regular full-body skin examinations.`],
w:{A:`Actinic keratoses are rough, scaly, erythematous macules or thin papules on sun-damaged skin, as seen on this patient's scalp and hands. They are precursors of squamous cell carcinoma, but they do not have translucent borders, surface vessels, or central ulceration.`,
C:`Keratoacanthoma is a rapidly growing (over weeks), dome-shaped nodule with a central keratin-filled crater. It is considered a variant of well-differentiated squamous cell carcinoma and may regress spontaneously. Slow growth over 8 months argues against it.`,
D:`Nodular melanoma is a rapidly enlarging, usually darkly pigmented (occasionally amelanotic) nodule that may bleed. It grows vertically early and carries a poor prognosis. A slowly growing translucent papule with branching vessels is characteristic of BCC.`,
E:`Squamous cell carcinoma often arises from actinic keratoses and presents as a scaly, hyperkeratotic, or ulcerated plaque or nodule, commonly on the lower lip, ears, and backs of the hands. It is more likely than BCC to metastasize, but it lacks the translucent, telangiectatic border seen here.`},
k:`Nodular basal cell carcinoma presents as a slow-growing, translucent papule with a raised border, branching telangiectasias, and central ulceration on sun-exposed skin. Mohs surgery is preferred for lesions on the central face.`},

{s:'Endocrinology',
q:`A 31-year-old woman comes to the office with 3 weeks of palpitations, heat intolerance, anxiety, and a 3-kg weight loss. She delivered a healthy infant 4 months ago and stopped breastfeeding 6 weeks ago. She takes no medications or supplements. Blood pressure is 128/70 mm Hg, and pulse is 108/min. She has a fine tremor of the outstretched hands. The thyroid gland is mildly and diffusely enlarged and nontender. There is no proptosis, lid lag, or skin thickening over the shins. Laboratory and imaging results are as follows:`,
lab:[['TSH','<0.01 µU/mL (reference: 0.4–4.0)'],['Free T4','3.1 ng/dL (reference: 0.8–1.8)'],['Thyroglobulin','Elevated'],['TSH receptor antibodies','Negative'],['Thyroid peroxidase antibodies','Positive'],['ESR','12 mm/hr'],['Radioactive iodine uptake (24 hr)','3% (reference: 10%–30%)']],
ask:`Which of the following is the most likely diagnosis?`,
o:['Graves disease','Painless postpartum thyroiditis','Subacute granulomatous thyroiditis','Toxic multinodular goiter','Surreptitious levothyroxine use'],a:1,
e:[`This patient has thyrotoxicosis with low radioactive iodine uptake (RAIU), which indicates that excess thyroid hormone is being released from a damaged gland (or taken exogenously) rather than newly synthesized. Postpartum thyroiditis occurs within 12 months of delivery (most often at 1–4 months) in about 5%–10% of women and is caused by autoimmune lymphocytic inflammation. Positive thyroid peroxidase antibodies, a painless, nontender gland, a normal ESR, and an elevated thyroglobulin level support the diagnosis.`,
`The classic course is a thyrotoxic phase lasting 1–3 months, followed by a hypothyroid phase, and then recovery; up to 30% of patients develop permanent hypothyroidism. Because hormone is released rather than synthesized, thionamides (methimazole, propylthiouracil) are ineffective. Symptomatic thyrotoxicosis is treated with a beta blocker such as propranolol, and TSH is checked every 4–8 weeks to detect the hypothyroid phase.`],
w:{A:`Graves disease causes thyrotoxicosis with diffusely increased RAIU and positive TSH receptor antibodies. It can present postpartum, but low uptake and negative TSH receptor antibodies exclude it here. Ophthalmopathy and pretibial myxedema are specific for Graves disease.`,
C:`Subacute granulomatous (de Quervain) thyroiditis also causes low-uptake thyrotoxicosis, but it typically follows a viral illness and presents with a painful, exquisitely tender thyroid, fever, and a markedly elevated ESR.`,
D:`Toxic multinodular goiter occurs mostly in older adults and causes thyrotoxicosis with patchy areas of increased uptake on scintigraphy. RAIU is normal or increased, not suppressed.`,
E:`Exogenous thyroid hormone causes low-uptake thyrotoxicosis, but thyroglobulin is low because the suppressed gland is not releasing stored hormone. An elevated thyroglobulin level indicates gland destruction instead.`},
k:`Thyrotoxicosis with low radioactive iodine uptake, a nontender gland, and positive TPO antibodies within 12 months of delivery suggests painless postpartum thyroiditis; treat symptoms with a beta blocker, not thionamides.`},

{s:'Gastroenterology',
q:`A 54-year-old man is brought to the emergency department after vomiting a large amount of bright red blood twice in the past 2 hours. He drinks 10–12 beers daily and has not seen a physician in many years. Blood pressure is 88/54 mm Hg, and pulse is 124/min. He is pale and diaphoretic. Examination shows scleral icterus, vascular spiders on the chest, gynecomastia, palmar erythema, and a distended abdomen with shifting dullness. The spleen tip is palpable. Two large-bore intravenous catheters are placed, a crystalloid infusion is started, and he is intubated for airway protection. Laboratory results are as follows:`,
lab:[['Hemoglobin','7.4 g/dL'],['Platelets','78,000/mm3'],['INR','1.6'],['Total bilirubin','3.1 mg/dL'],['Albumin','2.6 g/dL'],['Blood urea nitrogen','38 mg/dL'],['Creatinine','1.0 mg/dL']],
ask:`Which of the following is the most appropriate next step in management before upper endoscopy?`,
o:['Intravenous octreotide and ceftriaxone','Intravenous pantoprazole alone','Transfusion of packed red blood cells to a hemoglobin level >10 g/dL','Intravenous propranolol','Immediate balloon tamponade'],a:0,
e:[`This patient with signs of cirrhosis and portal hypertension (ascites, splenomegaly, thrombocytopenia, vascular spiders) has hemodynamically significant upper gastrointestinal bleeding, most likely from esophageal varices. Initial management includes airway protection, intravenous access, and restrictive red blood cell transfusion. Two medical therapies should be started immediately, before endoscopy: a splanchnic vasoconstrictor and antibiotic prophylaxis.`,
`Octreotide (a somatostatin analogue) reduces splanchnic blood flow and portal pressure, improving bleeding control. Patients with cirrhosis and gastrointestinal bleeding have a high risk of bacterial infection (eg, spontaneous bacterial peritonitis), which increases rebleeding and mortality; short-term prophylactic antibiotics (eg, ceftriaxone for up to 7 days) reduce infection, rebleeding, and death. Upper endoscopy with band ligation should be performed within 12 hours. Transjugular intrahepatic portosystemic shunt (TIPS) is used for bleeding that persists despite these measures and may be considered early in high-risk patients.`],
w:{B:`A proton pump inhibitor is reasonable until the source is confirmed, because peptic ulcer disease remains possible. However, it does not lower portal pressure and is not sufficient alone when variceal bleeding is suspected.`,
C:`Liberal transfusion increases portal pressure and is associated with more rebleeding and higher mortality in variceal hemorrhage. A restrictive strategy (transfuse when hemoglobin is <7 g/dL, target 7–9 g/dL) is preferred.`,
D:`Nonselective beta blockers (propranolol, nadolol, carvedilol) are used for primary and secondary prevention of variceal bleeding. They should not be given during acute bleeding with hypotension because they blunt compensatory tachycardia and worsen hypotension.`,
E:`Balloon tamponade is a temporary bridge for uncontrolled bleeding when endoscopy has failed or is unavailable. It has a high complication rate (esophageal perforation, aspiration) and is not first-line therapy.`},
k:`In suspected variceal hemorrhage, start octreotide and prophylactic antibiotics (eg, ceftriaxone) before endoscopy, transfuse restrictively (hemoglobin goal 7–9 g/dL), and perform endoscopic band ligation within 12 hours.`},

{s:'Gynecology',
q:`A 22-year-old woman comes to the emergency department with 3 days of lower abdominal pain, pain with intercourse, and a yellow vaginal discharge. She has had 2 new male sexual partners in the past 3 months and uses condoms inconsistently. Her last menstrual period was 10 days ago. Temperature is 38.4 C (101.1 F), blood pressure is 118/74 mm Hg, and pulse is 96/min. She is tolerating oral fluids and has not vomited. The abdomen is tender in both lower quadrants without rebound. Speculum examination shows mucopurulent discharge from the cervical os, and the cervix bleeds easily when touched with a swab. Bimanual examination shows marked tenderness with lateral movement of the cervix and bilateral adnexal tenderness without a palpable mass. Urine hCG is negative. Leukocyte count is 13,200/mm3. Pelvic ultrasound shows no adnexal mass or fluid collection. Nucleic acid amplification testing for gonorrhea and chlamydia is pending.`,
ask:`Which of the following is the most appropriate management?`,
o:['Intramuscular ceftriaxone once plus oral doxycycline and metronidazole for 14 days as an outpatient','Await nucleic acid amplification test results before starting antibiotics','Diagnostic laparoscopy','Oral azithromycin as a single dose','Hospital admission for intravenous clindamycin and gentamicin'],a:0,
e:[`This sexually active young woman has lower abdominal pain with cervical motion tenderness and adnexal tenderness, which meets the minimum criteria for pelvic inflammatory disease (PID). Fever, mucopurulent cervical discharge, cervical friability, and leukocytosis support the diagnosis. PID is an ascending polymicrobial infection of the upper genital tract caused by Neisseria gonorrhoeae, Chlamydia trachomatis, and vaginal flora, including anaerobes. Long-term complications include infertility, ectopic pregnancy, and chronic pelvic pain.`,
`Because delayed treatment increases the risk of tubal damage, empiric antibiotics should be started at diagnosis without waiting for test results. Most patients can be treated as outpatients with a single dose of intramuscular ceftriaxone plus 14 days of oral doxycycline and metronidazole. Patients should be reassessed within 72 hours, and sex partners from the previous 60 days should be evaluated and treated.`],
w:{B:`Nucleic acid amplification testing should be sent, but a negative result does not exclude PID, which is often caused by organisms other than gonorrhea and chlamydia. Waiting for results delays treatment and increases the risk of infertility and ectopic pregnancy.`,
C:`Laparoscopy can confirm PID but is reserved for diagnostic uncertainty (eg, possible appendicitis) or failure to respond to therapy. A clinical diagnosis is sufficient to begin treatment.`,
D:`A single dose of azithromycin does not adequately cover gonorrhea or anaerobes and is not an appropriate regimen for upper genital tract infection.`,
E:`Inpatient intravenous therapy (eg, cefoxitin plus doxycycline, or clindamycin plus gentamicin) is indicated for pregnancy, tubo-ovarian abscess, severe illness or high fever, inability to tolerate oral medication, failure of outpatient therapy, or when a surgical emergency cannot be excluded. This patient has none of these features.`},
k:`Treat pelvic inflammatory disease empirically when a sexually active woman has pelvic pain with cervical motion, uterine, or adnexal tenderness. Most patients receive outpatient IM ceftriaxone plus 14 days of doxycycline and metronidazole.`},

{s:'Hematology',
q:`A 66-year-old man is evaluated on postoperative day 7 after an elective right total knee arthroplasty. He has received subcutaneous unfractionated heparin for venous thromboembolism prophylaxis since surgery. This morning, he reports new swelling and aching in his left calf. He has had no bleeding. Temperature is 37.1 C (98.8 F), blood pressure is 134/80 mm Hg, and pulse is 88/min. The left calf is swollen and tender. The surgical wound is healing well without hematoma. Duplex ultrasound shows a noncompressible left popliteal vein. Laboratory results are as follows:`,
lab:[['Platelets, preoperative','248,000/mm3'],['Platelets, postoperative day 1','231,000/mm3'],['Platelets, postoperative day 7','96,000/mm3'],['Hemoglobin','11.6 g/dL'],['INR','1.0'],['Fibrinogen','Normal']],
ask:`Which of the following is the most appropriate next step in management?`,
o:['Continue heparin and transfuse platelets','Discontinue heparin and start argatroban','Discontinue heparin and start warfarin','Discontinue heparin and start enoxaparin','Discontinue heparin and observe without anticoagulation'],a:1,
e:[`This patient has heparin-induced thrombocytopenia (HIT): a >50% fall in platelet count 5–10 days after heparin exposure, with a new thrombosis. HIT is caused by IgG antibodies against complexes of platelet factor 4 (PF4) and heparin. These antibodies activate platelets, causing both thrombocytopenia and a highly prothrombotic state (venous more often than arterial thrombosis). Bleeding is uncommon. The 4Ts score (degree of thrombocytopenia, timing, thrombosis, and absence of other causes) estimates pretest probability; this patient's score is high.`,
`When HIT is suspected with intermediate or high probability, all heparin (including flushes and low-molecular-weight heparin) must be stopped immediately and a non-heparin anticoagulant started, without waiting for confirmatory testing (PF4-heparin immunoassay followed by serotonin release assay). Options include direct thrombin inhibitors (argatroban, preferred in kidney impairment; bivalirudin), fondaparinux, or a direct oral anticoagulant in stable patients. Anticoagulation is continued for at least 3 months when thrombosis is present.`],
w:{A:`Heparin must be stopped in HIT. Platelet transfusion is generally avoided because it can worsen antibody-mediated platelet activation and thrombosis, and bleeding is rare in HIT.`,
C:`Starting warfarin alone in acute HIT can cause venous limb gangrene and skin necrosis because warfarin depletes protein C before it reduces procoagulant factors. Warfarin may be started only after platelets recover to ≥150,000/mm3 and should overlap with a non-heparin anticoagulant for at least 5 days.`,
D:`Low-molecular-weight heparins such as enoxaparin cross-react with HIT antibodies in most patients and are contraindicated.`,
E:`Even without thrombosis, HIT carries a high risk of new thrombosis after heparin is stopped. This patient already has a deep venous thrombosis, so therapeutic anticoagulation with a non-heparin agent is required.`},
k:`Suspect HIT with a >50% platelet fall 5–10 days after heparin exposure, especially with new thrombosis. Stop all heparin and start a non-heparin anticoagulant (eg, argatroban); avoid warfarin until platelets recover.`},

{s:'Infectious Disease',
q:`A 34-year-old man comes to the clinic to establish care after being diagnosed with HIV infection last week during evaluation for oral thrush. He has had a 4-kg weight loss over 3 months but has no cough, dyspnea, fever, headache, or visual changes. He has no known drug allergies. Temperature is 37 C (98.6 F), and oxygen saturation is 98% on room air. White plaques on the buccal mucosa scrape off easily. The lungs are clear. Fundoscopic examination is normal. Antiretroviral therapy is started today. Laboratory results are as follows:`,
lab:[['CD4+ T-lymphocyte count','140/µL'],['HIV RNA viral load','85,000 copies/mL'],['Toxoplasma IgG','Negative'],['Cryptococcal antigen (serum)','Negative'],['Glucose-6-phosphate dehydrogenase','Normal'],['Chest x-ray','Normal']],
ask:`Which of the following is the most appropriate prophylactic therapy for this patient at this time?`,
o:['Azithromycin once weekly','Trimethoprim-sulfamethoxazole once daily','Fluconazole once daily','Valganciclovir once daily','No prophylaxis is indicated until the CD4 count is <50/µL'],a:1,
e:[`Primary prophylaxis against Pneumocystis jirovecii pneumonia (PCP) is indicated for patients with HIV who have a CD4 count <200/µL or a history of oropharyngeal candidiasis; this patient meets both criteria. Trimethoprim-sulfamethoxazole (TMP-SMX) is the agent of choice. It also provides prophylaxis against Toxoplasma gondii (indicated at CD4 <100/µL with positive Toxoplasma IgG) and some bacterial infections. Prophylaxis can be stopped once the CD4 count is >200/µL for ≥3 months on antiretroviral therapy.`,
`For patients who cannot take TMP-SMX (eg, severe sulfa allergy), alternatives include dapsone (after confirming normal G6PD activity), atovaquone, or monthly aerosolized pentamidine. This patient's thrush should be treated with a short course of fluconazole or clotrimazole troches, but long-term antifungal prophylaxis is not recommended.`],
w:{A:`Azithromycin was historically used as primary prophylaxis for Mycobacterium avium complex (MAC) at CD4 counts <50/µL. It is no longer recommended for patients who start antiretroviral therapy immediately, and this patient's CD4 count is above 50/µL.`,
C:`Primary fluconazole prophylaxis against cryptococcal disease or recurrent candidiasis is not recommended because it does not improve survival and promotes azole resistance. His thrush needs a treatment course, not ongoing prophylaxis.`,
D:`Primary prophylaxis against cytomegalovirus is not recommended. Patients with a CD4 count <50/µL should instead have regular dilated eye examinations to detect CMV retinitis early.`,
E:`The CD4 threshold of <50/µL was historically used for MAC prophylaxis, but PCP prophylaxis begins at <200/µL. Delaying it exposes the patient to a potentially fatal infection.`},
k:`Start TMP-SMX for Pneumocystis prophylaxis in HIV when the CD4 count is <200/µL or with oropharyngeal candidiasis; it also covers Toxoplasma when CD4 is <100/µL and Toxoplasma IgG is positive.`},

{s:'Musculoskeletal',
q:`A 63-year-old man comes to the emergency department because of severe pain in his right great toe that woke him from sleep. The pain began suddenly and became so intense that he cannot tolerate a bedsheet touching his foot. He attended a wedding over the weekend, where he drank several beers and ate red meat. He has hypertension treated with hydrochlorothiazide and stage 3b chronic kidney disease (eGFR 38 mL/min/1.73 m2). He has never had a similar episode. Temperature is 37.9 C (100.2 F). The right first metatarsophalangeal joint is swollen, warm, red, and exquisitely tender. Arthrocentesis is performed. Synovial fluid shows a leukocyte count of 28,000/mm3 (85% neutrophils), a negative Gram stain, and needle-shaped, negatively birefringent crystals. Serum uric acid is 8.6 mg/dL, and serum creatinine is 1.8 mg/dL.`,
ask:`Which of the following is the most appropriate treatment for this patient's acute symptoms?`,
o:['Allopurinol','Indomethacin','Oral prednisone','Febuxostat','Probenecid'],a:2,
e:[`This patient has an acute gout flare. Monosodium urate crystals are needle shaped and negatively birefringent. Flares are triggered by alcohol (especially beer), purine-rich foods, dehydration, and drugs that decrease renal urate excretion, such as thiazide and loop diuretics. Synovial fluid leukocyte counts are typically 2,000–50,000/mm3, and Gram stain and culture should be negative; however, septic arthritis can coexist with crystals and should be excluded when suspicion is high.`,
`First-line options for acute gout are NSAIDs, colchicine, and glucocorticoids, chosen according to comorbidities. In patients with chronic kidney disease, NSAIDs should be avoided, and colchicine requires dose reduction and carries a risk of toxicity. Glucocorticoids (oral prednisone or, for a single joint, intra-articular injection) are therefore preferred for this patient. Hydrochlorothiazide should be replaced with a non-diuretic antihypertensive (eg, losartan, which has a mild uricosuric effect).`],
w:{A:`Allopurinol, a xanthine oxidase inhibitor, is first-line urate-lowering therapy for recurrent flares, tophi, or urate nephropathy. It does not treat an acute flare, and starting it without anti-inflammatory prophylaxis can prolong or trigger flares by mobilizing urate.`,
B:`Indomethacin and other NSAIDs are effective for acute gout but reduce renal blood flow by inhibiting prostaglandins. They should be avoided in moderate to severe chronic kidney disease, heart failure, and peptic ulcer disease.`,
D:`Febuxostat, another xanthine oxidase inhibitor, lowers urate for long-term management but, like allopurinol, has no role in treating an acute flare.`,
E:`Probenecid increases renal urate excretion. It is ineffective in patients with reduced kidney function, increases the risk of uric acid stones, and does not treat acute inflammation.`},
k:`Treat acute gout with NSAIDs, colchicine, or glucocorticoids according to comorbidities; in chronic kidney disease, glucocorticoids are preferred. Urate-lowering therapy (eg, allopurinol) is for long-term prevention, not acute flares.`},

{s:'Neurology',fix:1,
q:`A 76-year-old man is brought to the office by his wife because of worsening memory and confusion. About 18 months ago, he began misplacing things, and he became lost twice while driving to his daughter's house, so he no longer drives. Over the past 10 months, he has also become slower when walking and dressing. His wife says his thinking "comes and goes": some days he does the crossword and discusses the news, and other days he stares out the window for hours and cannot follow a conversation. Last week, he asked her to put out food for the cat sitting by the couch; they have not had a cat in 20 years. She also says that for several years he has shouted and kicked during his sleep, and he once fell out of bed. He has hypertension and hyperlipidemia treated with lisinopril and atorvastatin.

Blood pressure is 138/80 mm Hg supine and 110/66 mm Hg standing, without a compensatory rise in heart rate. He is alert and pleasant. On the Montreal Cognitive Assessment, he scores 21/30, losing points on attention, clock drawing, and copying a cube. He recalls 2 of 5 words after a delay but recalls the rest when given category cues. Examination shows decreased facial expression, mild symmetric rigidity at the wrists, and slowed finger tapping without a resting tremor. Gait is slow with reduced arm swing, but stride length is normal and he turns without difficulty. Complete blood count, metabolic panel, vitamin B12, TSH, and urinalysis are normal. MRI of the brain shows mild generalized atrophy with relatively preserved medial temporal lobes and a few scattered punctate periventricular white matter hyperintensities.`,
ask:`Which of the following is the most likely diagnosis?`,
o:['Alzheimer disease','Dementia with Lewy bodies','Normal pressure hydrocephalus','Parkinson disease dementia','Vascular dementia'],a:1,
e:[`This patient has a progressive major neurocognitive disorder with several core features of dementia with Lewy bodies (DLB): fluctuating cognition and alertness (good days alternating with periods of staring and inattention), recurrent well-formed visual hallucinations (the cat), REM sleep behavior disorder (shouting and kicking during sleep that predates cognitive decline by years, caused by loss of normal REM atonia), and parkinsonism (bradykinesia, rigidity, decreased facial expression), which is usually symmetric and often without tremor in DLB. Supportive features include autonomic dysfunction (orthostatic hypotension without a compensatory heart-rate rise) and a cognitive profile dominated by attention, executive, and visuospatial deficits (clock drawing, cube copy). Memory is relatively spared early, and recall improves with cues, which suggests a retrieval rather than a storage problem. Relative preservation of the medial temporal lobes on MRI also favors DLB.`,
`DLB is caused by alpha-synuclein aggregates (Lewy bodies) in the cortex and brainstem. Recognizing it is important because up to 50% of patients have severe sensitivity reactions to antipsychotics, especially high-potency first-generation agents such as haloperidol, with worsening rigidity, confusion, and features resembling neuroleptic malignant syndrome. Acetylcholinesterase inhibitors (eg, rivastigmine, donepezil) are first-line for the cognitive symptoms and often reduce hallucinations. If an antipsychotic is unavoidable, low-dose quetiapine or pimavanserin is preferred. Levodopa may modestly improve motor symptoms but can worsen hallucinations.`],
w:{A:`Alzheimer disease is the most common cause of dementia and also presents with insidious memory loss and getting lost. However, its hallmark is an early storage deficit: delayed recall is poor and does not improve with cues. MRI typically shows disproportionate hippocampal and medial temporal atrophy. Early fluctuations, hallucinations, REM sleep behavior disorder, and parkinsonism are not features of early Alzheimer disease.`,
C:`Normal pressure hydrocephalus causes gait disturbance, urinary incontinence, and cognitive decline, with the gait problem usually appearing first. The gait is broad based and shuffling with short steps, feet that seem stuck to the floor, and difficulty turning. MRI shows ventricular enlargement out of proportion to sulcal atrophy. This patient's gait has normal stride length, and he has no incontinence or ventriculomegaly.`,
D:`Parkinson disease dementia shares nearly all the clinical and pathologic features of DLB, including hallucinations, fluctuations, REM sleep behavior disorder, and antipsychotic sensitivity. The 2 are distinguished by timing (the "1-year rule"): in Parkinson disease dementia, motor parkinsonism is established at least 1 year before dementia begins; in DLB, cognitive decline begins before or within 1 year of the parkinsonism. This patient's cognitive symptoms began about 8 months before his motor symptoms.`,
E:`Vascular dementia occurs in patients with stroke risk factors and typically shows a stepwise decline, focal neurologic deficits, and early executive slowing, with cortical or lacunar infarcts or extensive confluent white matter disease on MRI. A few punctate white matter hyperintensities are a common, nonspecific finding in older adults with hypertension and do not explain hallucinations, fluctuations, REM sleep behavior disorder, or parkinsonism.`},
k:`Dementia with Lewy bodies presents with fluctuating cognition, recurrent visual hallucinations, REM sleep behavior disorder, and parkinsonism, with early visuospatial and attention deficits. It is distinguished from Parkinson disease dementia by timing (cognitive decline begins before or within 1 year of parkinsonism). Avoid typical antipsychotics because of severe neuroleptic sensitivity.`},

{s:'Obstetrics',
q:`A 29-year-old woman, gravida 2 para 1, comes to the office for a routine prenatal visit at 28 weeks' gestation. Her pregnancy has been uncomplicated. Her first child was born 3 years ago by vaginal delivery at another hospital, and she does not know whether she received any injections during that pregnancy. She has had no vaginal bleeding, abdominal trauma, or invasive procedures during this pregnancy. Her partner's blood type is unknown. Blood pressure is 112/68 mm Hg. Fundal height is 28 cm, and the fetal heart rate is 144/min. Laboratory results from her first prenatal visit are as follows:`,
lab:[['Blood type','O, Rh(D) negative'],['Antibody screen (indirect Coombs)','Negative'],['Hemoglobin','11.8 g/dL'],['Rubella IgG','Immune'],['Antibody screen, repeated today','Negative']],
ask:`Which of the following is the most appropriate next step in management?`,
o:['Administer anti-D immune globulin now','Administer anti-D immune globulin only after delivery if the newborn is Rh(D) positive','No intervention, because the antibody screen is negative','Perform a Kleihauer-Betke test','Perform middle cerebral artery Doppler ultrasonography'],a:0,
e:[`Rh(D) alloimmunization occurs when an Rh(D)-negative mother is exposed to Rh(D)-positive fetal red blood cells and produces anti-D IgG antibodies, which can cross the placenta in later pregnancies and cause fetal hemolytic anemia and hydrops fetalis. A negative antibody screen shows that this patient has not been sensitized, so she is a candidate for prophylaxis.`,
`Anti-D immune globulin is given routinely at 28 weeks' gestation to all unsensitized Rh(D)-negative women unless the father is confirmed to be Rh(D) negative. It is given again within 72 hours of delivery if the newborn is Rh(D) positive, and after any event with potential fetomaternal hemorrhage (eg, miscarriage, ectopic pregnancy, amniocentesis, abdominal trauma, vaginal bleeding, or external cephalic version). Antenatal prophylaxis reduces the risk of sensitization from about 2% to about 0.1%.`],
w:{B:`Postpartum anti-D alone leaves the patient unprotected against fetomaternal hemorrhage in the third trimester, which accounts for most antepartum sensitization. Both antepartum (28 weeks) and postpartum doses are recommended.`,
C:`A negative antibody screen means she is not yet sensitized, which is exactly why prophylaxis is needed. Once anti-D antibodies have formed, anti-D immune globulin is no longer useful, and the pregnancy must instead be monitored for fetal anemia.`,
D:`The Kleihauer-Betke test measures the volume of fetal blood in the maternal circulation. It is used after delivery or a sensitizing event (eg, trauma) to determine whether additional doses of anti-D immune globulin are needed, not as routine screening at 28 weeks.`,
E:`Middle cerebral artery peak systolic velocity screens for fetal anemia in pregnancies already affected by alloimmunization (antibody titer above the critical threshold). This patient is not sensitized.`},
k:`Give anti-D immune globulin to unsensitized Rh(D)-negative women at 28 weeks' gestation, within 72 hours of delivering an Rh(D)-positive infant, and after any potentially sensitizing event.`},

{s:'Oncology',
q:`A 24-year-old man with newly diagnosed Burkitt lymphoma, bulky abdominal disease, and a serum lactate dehydrogenase level of 2,400 U/L begins induction chemotherapy. Thirty-six hours later, he reports muscle cramps and tingling around his mouth, and he has produced only 300 mL of urine in the past 12 hours. Blood pressure is 132/84 mm Hg, and pulse is 104/min. Tapping on the facial nerve in front of the ear causes twitching of the upper lip. ECG shows peaked T waves. Laboratory results are as follows:`,
labh:['Test','Before chemotherapy','Now'],
lab:[['Potassium','4.4 mEq/L','6.4 mEq/L'],['Phosphorus','4.1 mg/dL','8.2 mg/dL'],['Calcium','9.2 mg/dL','6.9 mg/dL'],['Uric acid','8.1 mg/dL','14.6 mg/dL'],['Creatinine','0.9 mg/dL','2.7 mg/dL']],
ask:`Which of the following measures, given before chemotherapy, would have been most effective in preventing this complication?`,
o:['Aggressive intravenous hydration and rasburicase','Intravenous calcium gluconate','Intravenous furosemide','Urine alkalinization with intravenous sodium bicarbonate','Prophylactic hemodialysis'],a:0,
e:[`This patient has tumor lysis syndrome (TLS): hyperkalemia, hyperphosphatemia, secondary hypocalcemia (perioral tingling, Chvostek sign), hyperuricemia, and acute kidney injury after chemotherapy. TLS results from the rapid release of intracellular contents from dying tumor cells. Highly proliferative, chemotherapy-sensitive malignancies with a large tumor burden (eg, Burkitt lymphoma, acute lymphoblastic leukemia) and a high LDH carry the greatest risk. Kidney injury is caused by precipitation of uric acid and calcium phosphate crystals in the renal tubules.`,
`Prevention depends on risk. All intermediate- and high-risk patients receive aggressive intravenous hydration to maintain high urine output. Intermediate-risk patients also receive allopurinol, which blocks new uric acid formation. High-risk patients (such as this one) or those with an elevated pretreatment uric acid should receive rasburicase, a recombinant urate oxidase that converts existing uric acid to soluble allantoin. Rasburicase is contraindicated in G6PD deficiency because it generates hydrogen peroxide and can cause hemolysis.`],
w:{B:`Calcium gluconate stabilizes the cardiac membrane in hyperkalemia with ECG changes and treats symptomatic hypocalcemia. It is not given prophylactically, and giving calcium when phosphorus is high can increase calcium phosphate precipitation in tissues and kidneys.`,
C:`Loop diuretics may be used to maintain urine output in volume-overloaded patients, but they do not prevent TLS and can cause volume depletion, which promotes crystal precipitation.`,
D:`Urine alkalinization was historically used to increase uric acid solubility but is no longer recommended. It promotes calcium phosphate precipitation in the kidneys and can worsen hypocalcemia.`,
E:`Hemodialysis treats established TLS with refractory hyperkalemia, severe hyperphosphatemia, symptomatic hypocalcemia, volume overload, or oliguric kidney injury. It is not used prophylactically.`},
k:`Prevent tumor lysis syndrome in high-risk malignancies (eg, Burkitt lymphoma, ALL) with aggressive IV hydration plus rasburicase; allopurinol is used for intermediate risk. Urine alkalinization is no longer recommended.`},

{s:'Ophthalmology',
q:`A 68-year-old man comes to the emergency department 90 minutes after he suddenly lost vision in his right eye while reading. He has no eye pain. He has hypertension, hyperlipidemia, and a 40-pack-year smoking history. He has had no headache, jaw pain with chewing, scalp tenderness, or shoulder stiffness. Blood pressure is 158/92 mm Hg, and pulse is 76/min and regular. Visual acuity is counting fingers at 1 foot in the right eye and 20/25 in the left eye. A right relative afferent pupillary defect is present. Intraocular pressure is normal in both eyes. Fundoscopic examination of the right eye shows a pale, opaque posterior retina with a preserved reddish-orange fovea and narrowed arterioles with segmented columns of blood. The optic disc is not swollen, and there are no retinal hemorrhages. A right carotid bruit is heard. ESR and CRP are normal.`,
ask:`Which of the following is the most likely diagnosis?`,
o:['Central retinal artery occlusion','Central retinal vein occlusion','Nonarteritic anterior ischemic optic neuropathy','Retinal detachment','Vitreous hemorrhage'],a:0,
e:[`Central retinal artery occlusion (CRAO) presents with sudden, painless, severe monocular vision loss, usually with a relative afferent pupillary defect. Ischemia makes the inner retina edematous and opaque. The fovea, which is thin and supplied by the underlying choroidal circulation, keeps its normal color and stands out as a red spot against the pale retina. Arterioles are narrowed, and segmented columns of blood may be seen. Most cases are caused by emboli from ipsilateral carotid atherosclerosis or the heart. In patients aged >50 years, giant cell arteritis must be considered; normal inflammatory markers and no systemic symptoms make it unlikely here.`,
`CRAO is a stroke of the eye and a medical emergency. Patients should be sent immediately to a stroke center because they have a high short-term risk of cerebral stroke. Evaluation includes brain imaging, carotid imaging (his bruit suggests carotid stenosis), ECG and cardiac monitoring for atrial fibrillation, and echocardiography. Conservative ocular maneuvers (eg, ocular massage) have not been shown to improve outcomes; intravenous thrombolysis within 4.5 hours of onset may be considered at some centers.`],
w:{B:`Central retinal vein occlusion also causes sudden painless monocular vision loss, but fundoscopy shows diffuse retinal hemorrhages in all quadrants, dilated tortuous veins, cotton wool spots, and optic disc swelling.`,
C:`Nonarteritic anterior ischemic optic neuropathy causes painless monocular vision loss, often noticed on waking, with a swollen optic disc (sometimes with nearby hemorrhages). It typically affects patients with a small, crowded optic disc and vascular risk factors. The retina itself is not pale.`,
D:`Retinal detachment is preceded by flashes of light, new floaters, and a curtain or shadow moving across the visual field. Fundoscopy shows an elevated, gray, folded retina.`,
E:`Vitreous hemorrhage (eg, from proliferative diabetic retinopathy) causes sudden floaters or painless vision loss, and blood obscures the view of the retina.`},
k:`Central retinal artery occlusion causes sudden painless monocular vision loss with a pale retina and a preserved red fovea. Treat it as a stroke: urgent stroke-center evaluation, including carotid imaging and cardiac monitoring, and consider giant cell arteritis in older patients.`},

{s:'Pediatrics',
q:`A 3-year-old girl is brought to the office because of fever for 6 days that has not responded to acetaminophen and ibuprofen. Her parents have also noticed red eyes without discharge, a rash on her trunk, and swelling of her hands and feet. She is irritable and drinking less. She is fully immunized. Temperature is 39.8 C (103.6 F), and pulse is 148/min. Examination shows bilateral conjunctival redness that spares the area around the iris; red, cracked lips; and a red tongue with prominent papillae. There is a 2-cm nontender lymph node on the left side of the neck. A blanching maculopapular rash covers the trunk and groin. The hands and feet are swollen, with redness of the palms and soles. The pharynx has no exudate. Laboratory results are as follows:`,
lab:[['Leukocytes','16,400/mm3 (72% neutrophils)'],['Hemoglobin','10.4 g/dL'],['Platelets','510,000/mm3'],['ESR','82 mm/hr'],['CRP','11.2 mg/dL'],['ALT','78 U/L'],['Albumin','2.9 g/dL'],['Urinalysis','15 leukocytes/hpf; nitrite negative; culture pending'],['Rapid streptococcal antigen','Negative']],
ask:`Which of the following is the most appropriate treatment to reduce the risk of this patient's most serious potential complication?`,
o:['Oral amoxicillin','Intravenous immune globulin and aspirin','Ibuprofen alone','Oral prednisolone alone','Vitamin A supplementation'],a:1,
e:[`This child has Kawasaki disease, a medium-vessel vasculitis that is the leading cause of acquired heart disease in children in high-income countries. Diagnosis requires fever for ≥5 days plus ≥4 of 5 features: bilateral nonexudative conjunctivitis (often sparing the limbus); oral changes (red, cracked lips; strawberry tongue); polymorphous rash; extremity changes (swelling and redness of the hands and feet, followed by peeling around the nails in weeks 2–3); and cervical lymphadenopathy (≥1.5 cm, usually unilateral). Supportive laboratory findings include elevated ESR and CRP, anemia, leukocytosis, hypoalbuminemia, elevated aminotransferases, sterile pyuria, and thrombocytosis after the first week.`,
`The most serious complication is coronary artery aneurysm, which occurs in about 25% of untreated children and can lead to thrombosis, myocardial infarction, and sudden death. Treatment with intravenous immune globulin (IVIG), ideally within the first 10 days of illness, lowers that risk to about 4%. Aspirin is given with IVIG for its anti-inflammatory and antiplatelet effects. Echocardiography is performed at diagnosis and repeated at 1–2 weeks and 4–6 weeks.`],
w:{A:`Scarlet fever (group A Streptococcus) causes fever, a sandpaper-like rash, and a strawberry tongue, but not conjunctivitis or swelling of the hands and feet, and it responds to amoxicillin. Her rapid strep test is negative, and antibiotics do not prevent coronary aneurysms.`,
C:`NSAIDs such as ibuprofen relieve fever but do not prevent coronary artery complications. Ibuprofen also interferes with the antiplatelet effect of aspirin and should be avoided in children taking aspirin for Kawasaki disease.`,
D:`Glucocorticoids are used together with IVIG in high-risk patients or for IVIG-resistant disease. Glucocorticoids alone are not standard initial therapy.`,
E:`Vitamin A is given to children with measles, which causes fever, cough, runny nose, and conjunctivitis followed by a rash that spreads from head to toe. This child is fully immunized and lacks the respiratory prodrome.`},
k:`Kawasaki disease (fever ≥5 days plus conjunctivitis, oral changes, rash, extremity changes, and cervical lymphadenopathy) is treated with IVIG and aspirin to reduce the risk of coronary artery aneurysms; obtain an echocardiogram.`},

{s:'Primary Care',
q:`A 41-year-old man comes to the office for a health maintenance examination. He feels well and has no abdominal pain, change in bowel habits, rectal bleeding, or weight loss. His father was diagnosed with colon adenocarcinoma at age 52 and is alive after surgery and chemotherapy. No other relatives have had colorectal polyps or cancer. He does not smoke and drinks alcohol occasionally. He takes no medications. Vital signs and physical examination, including rectal examination, are normal. Complete blood count is normal.`,
ask:`Which of the following is the most appropriate colorectal cancer screening strategy for this patient?`,
o:['Colonoscopy now and every 5 years if normal','Colonoscopy at age 45 and every 10 years if normal','Annual fecal immunochemical testing beginning at age 45','Colonoscopy at age 50 and every 10 years if normal','Germline testing for Lynch syndrome in place of colonoscopy'],a:0,
e:[`Patients with a first-degree relative diagnosed with colorectal cancer or an advanced adenoma before age 60 (or with 2 or more first-degree relatives diagnosed at any age) are at increased risk. They should begin colonoscopy at age 40 or 10 years before the age at which the youngest affected relative was diagnosed, whichever comes first, and repeat colonoscopy every 5 years. For this patient, 10 years before his father's diagnosis is age 42, so screening should begin at 40; that is, now.`,
`Colonoscopy is preferred over stool-based tests in high-risk patients because it allows adenomas to be found and removed. In contrast, average-risk adults (and those whose first-degree relative was diagnosed at age ≥60) begin screening at age 45 with any recommended method, such as colonoscopy every 10 years or annual fecal immunochemical testing.`],
w:{B:`Starting at 45 with 10-year intervals is the strategy for average-risk adults. His father's diagnosis before age 60 places him at increased risk, which calls for earlier and more frequent colonoscopy.`,
C:`Annual fecal immunochemical testing is an acceptable option for average-risk adults but is less sensitive than colonoscopy for advanced adenomas and is not recommended as the main strategy for high-risk patients.`,
D:`Age 50 was the historical starting age for average-risk screening; it is now 45 for average risk and earlier for increased risk.`,
E:`Germline testing for Lynch syndrome is considered when family history meets criteria (eg, multiple affected relatives, cancers at young ages, or associated cancers such as endometrial cancer) or when the tumor shows mismatch repair deficiency. A single relative diagnosed at 52 does not meet these criteria, and genetic testing would not replace screening.`},
k:`With a first-degree relative diagnosed with colorectal cancer before age 60, begin colonoscopy at age 40 or 10 years before the relative's diagnosis (whichever is earlier) and repeat every 5 years.`},

{s:'Psychiatry',
q:`A 24-year-old man is brought to the emergency department by his roommate because of unusual behavior for the past 9 days. He has been sleeping about 2 hours per night but says he feels more energetic than ever. He quit his job to start 3 businesses at once and has charged $14,000 to credit cards for equipment and travel. He speaks rapidly, is difficult to interrupt, and jumps from topic to topic. He says he has been chosen to transform the medical device industry. Eighteen months ago, he had a 3-month period of low mood, sleeping 12 hours a day, and poor concentration that resolved without treatment. He does not use alcohol or drugs, and a urine drug screen is negative. He takes no medications. Vital signs are normal. He is dressed in a brightly colored suit and is restless. Physical examination and TSH are normal.`,
ask:`Which of the following is the most likely diagnosis?`,
o:['Bipolar I disorder','Bipolar II disorder','Cyclothymic disorder','Schizoaffective disorder','Major depressive disorder with mixed features'],a:0,
e:[`This patient has a manic episode: a distinct period of abnormally and persistently elevated, expansive, or irritable mood and increased energy lasting ≥1 week (or any duration if hospitalization is required), with ≥3 additional symptoms. These include distractibility, impulsive or risky behavior, grandiosity, flight of ideas, increased goal-directed activity, decreased need for sleep, and pressured speech. The episode causes marked impairment (quitting his job, large debts). A single manic episode that is not explained by a substance or medical condition establishes the diagnosis of bipolar I disorder; prior depressive episodes are common but not required.`,
`Acute mania is treated with a mood stabilizer (lithium or valproate) and/or a second-generation antipsychotic (eg, quetiapine, olanzapine, risperidone), and severe cases often require hospitalization. Antidepressant monotherapy should be avoided because it can precipitate or worsen mania. Lithium requires monitoring of serum levels and kidney and thyroid function.`],
w:{B:`Bipolar II disorder requires at least 1 hypomanic episode and at least 1 major depressive episode, with no history of mania. Hypomania lasts ≥4 days and is not severe enough to cause marked impairment, require hospitalization, or include psychosis. This patient's episode has lasted 9 days and caused marked impairment, which makes it mania.`,
C:`Cyclothymic disorder involves ≥2 years (≥1 year in adolescents) of numerous periods of hypomanic and depressive symptoms that never meet full criteria for a hypomanic, manic, or major depressive episode.`,
D:`Schizoaffective disorder requires delusions or hallucinations for ≥2 weeks in the absence of a major mood episode, in addition to mood episodes during most of the illness. This patient's grandiose beliefs occur only during a mood episode.`,
E:`Major depressive disorder with mixed features describes a major depressive episode accompanied by ≥3 manic or hypomanic symptoms. This patient's current episode is predominantly elevated mood with increased energy, not depression.`},
k:`A single manic episode (≥1 week of elevated or irritable mood with increased energy and marked impairment, or any duration requiring hospitalization) establishes bipolar I disorder; hypomania (≥4 days, no marked impairment) plus major depression defines bipolar II.`},

{s:'Pulmonary',
q:`A 34-year-old woman comes to the emergency department because of sharp right-sided chest pain and shortness of breath that began suddenly 6 hours ago. The pain worsens with deep breaths. Two days ago, she returned from a 14-hour international flight. She takes a combined estrogen-progestin oral contraceptive and has no other medical history. She does not smoke. Temperature is 37.4 C (99.3 F), blood pressure is 122/78 mm Hg, pulse is 116/min, respirations are 24/min, and oxygen saturation is 91% on room air. The lungs are clear to auscultation. Heart sounds are normal without murmurs or rubs. There is no leg swelling or calf tenderness. ECG shows sinus tachycardia. Chest x-ray is normal. Urine hCG is negative, and serum creatinine is 0.7 mg/dL. She has no known allergies.`,
ask:`Which of the following is the most appropriate next step in diagnosis?`,
o:['CT pulmonary angiography','D-dimer measurement','Transthoracic echocardiography','Ventilation-perfusion scan','Lower extremity compression ultrasonography'],a:0,
e:[`This patient has sudden pleuritic chest pain, dyspnea, tachycardia, and hypoxemia with a clear chest x-ray, along with risk factors for venous thromboembolism (prolonged air travel, an estrogen-containing contraceptive). These findings strongly suggest pulmonary embolism (PE). Evaluation begins with an estimate of clinical probability. Her Wells score is 4.5 (heart rate >100/min, 1.5 points; PE is the most likely diagnosis, 3 points), which means PE is likely.`,
`In hemodynamically stable patients with a high (likely) pretest probability, CT pulmonary angiography (CTPA) is the diagnostic test of choice. D-dimer is not helpful because a normal result would not reliably exclude PE at this probability. If imaging will be delayed and there is no contraindication, empiric anticoagulation should be started while awaiting CTPA. Once PE is confirmed, a direct oral anticoagulant (eg, apixaban, rivaroxaban) is preferred, and the estrogen-containing contraceptive should be stopped.`],
w:{B:`D-dimer is highly sensitive but nonspecific. It is used to exclude PE in patients with low or intermediate (unlikely) pretest probability. In a high-probability patient, a negative result does not exclude PE, so she needs imaging regardless.`,
C:`Bedside echocardiography is useful in hemodynamically unstable patients who cannot safely go to CT, where right ventricular dilation and dysfunction support the diagnosis and justify thrombolysis. It is not sensitive enough to exclude PE in stable patients.`,
D:`Ventilation-perfusion scanning is an alternative when CTPA is contraindicated (eg, severe contrast allergy or significant kidney dysfunction) and is often preferred in pregnancy. This patient has normal kidney function and no contrast allergy.`,
E:`Compression ultrasonography can be used when CTPA is contraindicated, because finding a deep venous thrombosis in a patient with suspected PE justifies treatment. However, a negative leg ultrasound does not exclude PE, and she has no leg symptoms.`},
k:`In a hemodynamically stable patient with suspected pulmonary embolism and a high (likely) pretest probability, proceed directly to CT pulmonary angiography; reserve D-dimer for low or intermediate (unlikely) probability.`},

{s:'Renal',
q:`A 61-year-old man with stage 4 chronic kidney disease and heart failure with reduced ejection fraction is brought to the emergency department because of 2 days of generalized weakness and nausea. His medications include lisinopril, spironolactone, carvedilol, and furosemide. Last week, he started taking over-the-counter ibuprofen for knee pain. Blood pressure is 108/66 mm Hg, and pulse is 54/min. He is alert. There is 1+ pitting edema of both legs. Strength is 4/5 in the proximal arms and legs. An ECG is obtained; selected leads are shown below. A repeat blood sample drawn without hemolysis confirms the results below.`,
fig:{ecg:'hyperk',cap:'Leads II and V3.'},
lab:[['Sodium','134 mEq/L'],['Potassium','7.4 mEq/L'],['Bicarbonate','17 mEq/L'],['Blood urea nitrogen','68 mg/dL'],['Creatinine','3.9 mg/dL (baseline 2.9 mg/dL)'],['Glucose','104 mg/dL']],
ask:`Which of the following is the most appropriate first step in management?`,
o:['Intravenous calcium gluconate','Intravenous regular insulin with dextrose','Oral sodium zirconium cyclosilicate','Urgent hemodialysis','Intravenous furosemide'],a:0,
e:[`This patient has severe hyperkalemia caused by impaired kidney excretion (chronic kidney disease with acute kidney injury from NSAID use) combined with drugs that reduce aldosterone effect (lisinopril, spironolactone). The ECG shows tall, narrow, peaked T waves, absent P waves, and a widened QRS complex. These changes reflect cardiac membrane instability that can progress to a sine-wave pattern, ventricular fibrillation, or asystole.`,
`When hyperkalemia causes ECG changes, the first step is intravenous calcium (gluconate or chloride), which counteracts the effect of potassium on the cardiac membrane within minutes. Calcium does not lower serum potassium, and its effect lasts only 30–60 minutes. It is followed by therapies that shift potassium into cells (insulin with dextrose, nebulized albuterol, and sodium bicarbonate if acidemic) and then by therapies that remove potassium from the body (loop diuretics, potassium binders, or hemodialysis). Lisinopril, spironolactone, and ibuprofen should be stopped.`],
w:{B:`Insulin (with dextrose to prevent hypoglycemia) is the most reliable way to shift potassium into cells, lowering it by about 0.5–1.2 mEq/L within 15–30 minutes. It should be given promptly, but after calcium, because it does not protect the heart as quickly.`,
C:`Sodium zirconium cyclosilicate and patiromer bind potassium in the gut. Their onset is slower (1 hour to several hours), so they are used after acute stabilization or for chronic hyperkalemia.`,
D:`Hemodialysis is the definitive therapy for life-threatening hyperkalemia in severe kidney failure and may be needed in this patient. However, arranging it takes time, and the heart must be protected with calcium first.`,
E:`Loop diuretics increase renal potassium excretion and help patients who still make urine and are volume overloaded. Their effect is slow and unreliable in advanced kidney disease, and they do not protect against arrhythmia.`},
k:`Hyperkalemia with ECG changes (peaked T waves, widened QRS, loss of P waves) requires immediate IV calcium to stabilize the cardiac membrane, followed by insulin with dextrose to shift potassium and then measures to remove potassium.`},

{s:'Surgery',
q:`A 64-year-old woman comes to the emergency department because of 1 day of crampy abdominal pain around the umbilicus that comes in waves, with nausea and 4 episodes of green vomiting. She has not passed stool or gas for 12 hours. She had an abdominal hysterectomy 10 years ago and an open appendectomy as a child. Temperature is 37.2 C (99 F), blood pressure is 128/80 mm Hg, and pulse is 96/min. The abdomen is distended and tympanic, with high-pitched bowel sounds and mild diffuse tenderness without rebound or guarding. There are well-healed lower midline and right lower quadrant scars without hernias. Leukocyte count is 9,800/mm3, lactate is 1.2 mmol/L, potassium is 3.4 mEq/L, and creatinine is 1.0 mg/dL. CT of the abdomen and pelvis with intravenous contrast shows dilated, fluid-filled loops of small bowel up to 4 cm with an abrupt transition point in the right lower quadrant and a collapsed distal ileum and colon. There is no free air, gas in the bowel wall, bowel wall thickening, or closed-loop configuration.`,
ask:`Which of the following is the most appropriate next step in management?`,
o:['Bowel rest, nasogastric tube decompression, intravenous fluids, and serial abdominal examinations','Emergency exploratory laparotomy','Colonoscopic decompression','Intravenous neostigmine','Oral polyethylene glycol bowel preparation'],a:0,
e:[`This patient has a small bowel obstruction (SBO), most likely due to adhesions from prior abdominal surgery, which cause about 60%–70% of SBOs in adults. Typical features are colicky abdominal pain, vomiting (bilious with proximal obstruction), abdominal distension, and inability to pass gas or stool. CT confirms the diagnosis by showing dilated small bowel (>3 cm) with a transition point to collapsed distal bowel, and it identifies signs of complications (closed loop, ischemia, perforation).`,
`Patients with adhesive SBO and no signs of strangulation (fever, tachycardia, peritonitis, leukocytosis, elevated lactate, or concerning CT findings) are first managed nonoperatively with bowel rest, nasogastric decompression, intravenous fluids, electrolyte replacement (her potassium is low), and serial examinations. Most partial adhesive obstructions resolve within 48–72 hours. A water-soluble contrast challenge can predict resolution and may hasten it. Surgery is indicated for signs of strangulation, closed-loop obstruction, or failure to improve within 3–5 days.`],
w:{B:`Emergency laparotomy is indicated for SBO with signs of ischemia or strangulation (peritonitis, fever, leukocytosis, rising lactate, closed-loop obstruction, gas in the bowel wall) or perforation. This patient is stable, with reassuring laboratory and CT findings.`,
C:`Colonoscopic decompression is used for acute colonic pseudo-obstruction (Ogilvie syndrome) and to untwist a sigmoid volvulus. It cannot relieve a small bowel obstruction, and her colon is collapsed.`,
D:`Neostigmine, an acetylcholinesterase inhibitor, treats acute colonic pseudo-obstruction by increasing colonic motility. It is contraindicated in mechanical obstruction because stronger peristalsis against a fixed blockage can cause perforation.`,
E:`Bowel preparations and other oral laxatives are contraindicated in mechanical obstruction because they increase the volume and pressure inside the bowel, raising the risk of vomiting, aspiration, and perforation.`},
k:`Uncomplicated adhesive small bowel obstruction is first managed with bowel rest, nasogastric decompression, IV fluids, and serial examinations; operate for strangulation, closed loop, perforation, or failure to resolve.`},

{s:'Urology',
q:`A 71-year-old man comes to the office because of 8 months of gradually worsening urinary frequency, hesitancy, a weak stream, and waking 3 times a night to urinate. He has no painful urination, blood in the urine, fever, bone pain, or weight loss. He has hypertension controlled with amlodipine. Vital signs are normal. There is no suprapubic fullness. Digital rectal examination shows a mildly enlarged, smooth prostate with a firm, nontender, 1-cm area in the right lobe; the median groove is preserved. There is no spinal tenderness. Laboratory results are as follows:`,
lab:[['Prostate-specific antigen','6.8 ng/mL (2 years ago: 3.1 ng/mL)'],['Urinalysis','Normal; no pyuria'],['Serum creatinine','1.0 mg/dL'],['Alkaline phosphatase','82 U/L'],['Postvoid residual (bladder scan)','60 mL']],
ask:`Which of the following is the most appropriate next step in management?`,
o:['Tamsulosin and repeat PSA in 3 months','Finasteride and repeat PSA in 6 months','A 4-week course of ciprofloxacin, then repeat PSA','Prostate biopsy, preferably guided by multiparametric MRI','Technetium-99m bone scan'],a:3,fix:1,
e:[`This patient has progressive lower urinary tract symptoms (eg, frequency, hesitancy, nocturia). In light of the palpable, firm prostate nodule and the elevated and rising prostate-specific antigen (PSA) level, prostate adenocarcinoma must be excluded. Prostate cancer arises most often in the peripheral zone, which is why it can be felt on rectal examination; it can metastasize to the axial skeleton and proximal femurs but frequently follows an indolent course. Although his urinary symptoms and enlarged gland are consistent with coexisting benign prostatic hyperplasia (BPH), BPH does not cause a discrete firm nodule.`,
`Prostate biopsy is required for definitive diagnosis, most often guided by transrectal or transperineal ultrasound, with multiparametric MRI obtained beforehand to identify and target suspicious lesions. Biopsy also provides prognostic information based on the pathologic grade (Gleason score/Grade Group). Depending on risk category and life expectancy, the 3 primary treatment options for localized prostate cancer are active surveillance, radical prostatectomy, and radiation therapy. Staging imaging (eg, bone scan or PSMA PET) is performed after diagnosis in patients at unfavorable intermediate or high risk.`],
w:{A:`Alpha-1 blockers such as tamsulosin are the preferred initial treatment for symptomatic BPH and provide rapid relief by relaxing bladder neck and prostatic smooth muscle. Although BPH can mildly elevate PSA, a palpable nodule or gross asymmetry warrants biopsy to exclude prostate cancer, and treating symptoms first would delay the diagnosis.`,
B:`5-alpha-reductase inhibitors such as finasteride reduce prostate size in BPH but take months to work. They lower PSA by about 50%, which can mask a rising PSA and delay the diagnosis of cancer. They do not address a suspicious nodule.`,
C:`Acute or chronic bacterial prostatitis can raise PSA, but it presents with painful urination, pelvic or perineal pain, fever, and pyuria, with a tender, boggy prostate. This patient has none of these features, and empiric antibiotics would delay diagnosis.`,
E:`A bone scan is used to stage newly diagnosed prostate cancer at higher risk (eg, PSA >20 ng/mL, Grade Group ≥4, or T3 disease) or in patients with bone pain. It should not come before a tissue diagnosis.`},
k:`A firm prostate nodule or rising PSA requires prostate biopsy (ideally MRI-targeted) for diagnosis and Gleason grading; do not attribute it to BPH or treat empirically with alpha blockers, 5-alpha-reductase inhibitors, or antibiotics.`}
];
QDATA.push(
{s:'Biostatistics',fix:1,
q:`A randomized controlled trial enrolls 8,000 adults aged 40–75 years with type 2 diabetes mellitus and no known cardiovascular disease. Participants are assigned to a moderate-intensity statin or placebo and followed for 5 years for the composite outcome of myocardial infarction, stroke, or cardiovascular death. The outcome occurs in 10% of participants in the placebo group and 6% of participants in the statin group. Rates of adverse events, including muscle aches and new aminotransferase elevations, are similar between groups. A primary care physician is counseling a patient who meets the trial's enrollment criteria about the potential benefit of starting therapy.`,
ask:`Approximately how many patients similar to those in this trial would need to be treated with a statin for 5 years to prevent 1 composite outcome?`,
o:['4','10','17','25','40'],a:3,
e:[`The number needed to treat (NNT) is the reciprocal of the absolute risk reduction (ARR). The ARR is the difference in event rates between the control and treatment groups: 10% − 6% = 4% (0.04). The NNT is therefore 1/0.04 = 25. Treating 25 patients for 5 years prevents 1 myocardial infarction, stroke, or cardiovascular death.`,
`NNT always refers to the time frame of the study (here, 5 years) and is useful in counseling because it reflects the absolute size of the benefit. The relative risk is 0.06/0.10 = 0.6, and the relative risk reduction (RRR) is 1 − 0.6 = 40%. RRR sounds larger and is often emphasized, but the same RRR produces a much larger NNT when baseline risk is low.`],
w:{A:`4 is the ARR expressed as a percentage, not the NNT. The NNT is the reciprocal of the ARR expressed as a decimal (1/0.04).`,
B:`10 is the reciprocal of the event rate in the placebo group (1/0.10). It ignores the comparison between groups and has no direct clinical meaning.`,
C:`17 is approximately the reciprocal of the event rate in the statin group (1/0.06). It also ignores the comparison between groups.`,
E:`40 is the relative risk reduction expressed as a percentage ([0.10 − 0.06]/0.10). RRR describes the proportional benefit but does not account for baseline risk.`},
k:`Number needed to treat = 1/absolute risk reduction, where ARR is the control event rate minus the treatment event rate. NNT applies to the study's follow-up period.`},

{s:'Cardiology',
q:`A 58-year-old woman comes to the office for follow-up of hypertension and type 2 diabetes mellitus. Six weeks ago, lisinopril was started after her urine albumin-to-creatinine ratio was 140 mg/g on 2 separate occasions (reference: <30 mg/g). Since then, she has had a dry, nonproductive cough that is worse at night and keeps her husband awake. She has had no fever, runny nose, heartburn, wheezing, or weight loss. She has never smoked. Her other medications are metformin and atorvastatin. Blood pressure is 128/78 mm Hg, and pulse is 76/min. The oropharynx is normal, and the lungs are clear. There is no leg swelling. A chest x-ray last week was normal. Serum creatinine is 0.9 mg/dL, and potassium is 4.6 mEq/L.`,
ask:`Which of the following is the most appropriate next step in management?`,
o:['Discontinue lisinopril and start losartan','Discontinue lisinopril and start amlodipine','Continue lisinopril and add dextromethorphan','Discontinue lisinopril and start hydrochlorothiazide','Pulmonary function testing with methacholine challenge'],a:0,
e:[`Angiotensin-converting enzyme (ACE) inhibitors cause a dry cough in up to 10%–15% of patients, more often in women and people of East Asian descent. ACE normally breaks down bradykinin and substance P; inhibiting it allows these mediators to accumulate in the airway and sensitize the cough reflex. The cough usually begins within a week to a few months of starting therapy and resolves within 1–4 weeks of stopping (occasionally up to 3 months). It is a class effect, so switching to another ACE inhibitor does not help.`,
`Because this patient has diabetic kidney disease with albuminuria, she should stay on renin-angiotensin system blockade, which reduces albuminuria and slows progression of chronic kidney disease. Angiotensin II receptor blockers (ARBs) such as losartan block the angiotensin II type 1 receptor without affecting bradykinin breakdown and rarely cause cough. Potassium and creatinine should be rechecked 1–2 weeks after starting the ARB.`],
w:{B:`Amlodipine, a dihydropyridine calcium channel blocker, lowers blood pressure effectively but does not reduce albuminuria or provide the kidney protection of ACE inhibitors and ARBs. It is a reasonable add-on, not a replacement, in this patient.`,
C:`Cough suppressants do not reliably control ACE inhibitor cough, and continuing the drug leaves the cause in place. The definitive treatment is stopping the ACE inhibitor.`,
D:`Thiazide diuretics are first-line antihypertensives for many patients but, like amlodipine, do not reduce albuminuria in diabetic kidney disease.`,
E:`Methacholine challenge evaluates for cough-variant asthma, a common cause of chronic cough. The timing relative to lisinopril, the absence of wheezing, and normal imaging make the ACE inhibitor the most likely cause, so testing is unnecessary before a trial off the drug.`},
k:`ACE inhibitor cough results from bradykinin accumulation. Patients who need renin-angiotensin system blockade (eg, diabetic albuminuria, heart failure) should be switched to an ARB.`},

{s:'Cardiology',
q:`A 72-year-old woman comes to the emergency department because of 2 weeks of intermittent palpitations and fatigue. She has hypertension and type 2 diabetes mellitus. She has no history of stroke, bleeding, or heart failure. Medications are lisinopril and metformin. Blood pressure is 138/84 mm Hg, and pulse is 112/min. Cardiac examination shows an irregular rhythm without murmurs. A rhythm strip is shown below. Echocardiography shows a left ventricular ejection fraction of 60%, mild left atrial enlargement, and normal mitral and aortic valves. Hemoglobin is 13.1 g/dL, platelets are 240,000/mm3, and serum creatinine is 0.9 mg/dL. TSH is normal. Her heart rate improves to 82/min with oral metoprolol.`,
fig:{ecg:'afib',cap:'Lead II rhythm strip.'},
ask:`Which of the following is the most appropriate long-term therapy to reduce this patient's risk of stroke?`,
o:['Aspirin','Aspirin and clopidogrel','Apixaban','No antithrombotic therapy; rate control is sufficient','Warfarin with a target INR of 2.5–3.5'],a:2,
e:[`The rhythm strip shows an irregularly irregular narrow-complex rhythm without discernible P waves and with an undulating baseline, consistent with atrial fibrillation (AF). Stroke risk in AF without moderate to severe mitral stenosis or a mechanical valve is estimated with the CHA2DS2-VASc score. This patient scores 4: age 65–74 (1), female sex (1), hypertension (1), and diabetes (1). Long-term oral anticoagulation is recommended for a score of ≥2 in men or ≥3 in women.`,
`Direct oral anticoagulants (DOACs) such as apixaban, rivaroxaban, edoxaban, and dabigatran are preferred over warfarin because they are at least as effective for stroke prevention, cause less intracranial hemorrhage, and do not require INR monitoring. Warfarin remains the anticoagulant of choice for moderate to severe mitral stenosis or a mechanical heart valve.`],
w:{A:`Aspirin alone provides little stroke protection in AF and carries a bleeding risk similar to that of DOACs. It is no longer recommended for stroke prevention in AF.`,
B:`Dual antiplatelet therapy is less effective than oral anticoagulation for AF-related stroke and causes a comparable rate of major bleeding. It is used after coronary stenting, not for AF.`,
D:`Rate control relieves symptoms but does not reduce thromboembolic risk. Stroke risk depends on the CHA2DS2-VASc score, whether AF is paroxysmal, persistent, or rate controlled.`,
E:`Warfarin is an acceptable alternative when DOACs cannot be used, but the target INR in this setting is 2.0–3.0. A target of 2.5–3.5 is used for mechanical mitral valves.`},
k:`In atrial fibrillation without mitral stenosis or a mechanical valve, anticoagulate when CHA2DS2-VASc is ≥2 in men or ≥3 in women; DOACs are preferred over warfarin.`},

{s:'Dermatology',
q:`A 34-year-old woman comes to the office because her partner noticed that a mole on her upper back has changed over the past 4 months. It is not painful or itchy. She had several blistering sunburns as a teenager and used tanning beds in college. Examination shows a 9-mm flat lesion with an irregular, notched border and areas of dark brown, black, and blue-gray color. A representative lesion is shown below. It looks different from her other moles, which are uniformly tan and smaller than 5 mm. There is no axillary or cervical lymphadenopathy.`,
fig:{img:'https://commons.wikimedia.org/wiki/Special:FilePath/Melanoma.jpg?width=640',cap:'Representative lesion. Image: National Cancer Institute (public domain), via Wikimedia Commons.',alt:'Irregular, multicolored pigmented skin lesion'},
ask:`Which of the following is the most appropriate next step in management?`,
o:['Cryotherapy of the lesion','Excisional biopsy with 1- to 3-mm margins','Repeat dermoscopy and photography in 3 months','Superficial shave biopsy','Wide local excision with 2-cm margins'],a:1,
e:[`This lesion has several features concerning for melanoma: asymmetry, an irregular border, multiple colors, a diameter >6 mm, and evolution over time. It also looks different from her other moles (the "ugly duckling" sign). Her risk factors include intermittent intense sun exposure with blistering sunburns and indoor tanning.`,
`Excisional biopsy with narrow (1–3 mm) margins of normal skin, extending into the subcutaneous fat, is preferred for a suspected melanoma. Removing the whole lesion lets the pathologist measure the full Breslow thickness, which is the most important prognostic factor and determines the margins of the definitive wide local excision and the need for sentinel lymph node biopsy. Narrow initial margins also preserve lymphatic drainage for later sentinel node mapping.`],
w:{A:`Cryotherapy destroys tissue without providing a specimen. It is used for actinic keratoses and warts, never for a lesion suspected to be melanoma.`,
